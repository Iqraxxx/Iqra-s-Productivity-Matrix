<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Iqra's Productivity Matrix</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" id="metaIosStatusBar" content="black-translucent">
<meta name="theme-color" id="metaThemeColor" content="transparent">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f8fafc;
    --surface: #ffffff;
    --subtle: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0f172a;
    --accent-text: #ffffff;
    --date-bg: #ffffff;
    --card-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }

  /* Sticky Note Light Yellow Theme */
  body[data-theme="yellow"] {
    --bg: #fef9c3;
    --sidebar: #fef08a;
    --surface: #fefce8;
    --subtle: #fde04755;
    --border: #ca8a0455;
    --text: #422006;
    --muted: #854d0e;
    --accent: #a16207;
    --accent-text: #ffffff;
    --date-bg: #fefce8;
    --card-shadow: 0 2px 10px rgba(66, 32, 6, 0.05);
  }

  /* Rich Obsidian-Slate Dark Mode Theme */
  body[data-theme="dark"] {
    --bg: #090d16;
    --sidebar: #0e1422;
    --surface: #131c2e;
    --subtle: #19243a;
    --border: #26334d;
    --text: #e2e8f0;
    --muted: #8b9bb4;
    --accent: #60a5fa;
    --accent-text: #071120;
    --date-bg: #0f1729;
    --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    background: var(--bg);
    color: var(--text);
    overflow-x: clip;
    margin: 0;
    padding: 0;
    min-height: 100%;
    transition: background 0.2s ease, color 0.2s ease;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    overflow-x: clip;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .edge-swipe-zone { display: none; }
  @media (max-width: 768px) {
    .edge-swipe-zone {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 22px;
      z-index: 90;
    }
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.6);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 95;
  }
  .sidebar-backdrop.active { display: block; }

  .sidebar {
    width: 310px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 48px;
    transition: margin-left 0.25s ease, transform 0.25s ease, background 0.2s ease;
    flex-shrink: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .sidebar.closed { margin-left: -310px; }

  .sidebar-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-top-row span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .side-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    box-shadow: var(--card-shadow);
  }
  .side-box h4 {
    margin: 0 0 8px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  .side-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 16px;
    margin-bottom: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .side-input:focus { border-color: var(--accent); }

  .dmy-date-field {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 8px;
  }
  .dmy-date-field input[type="text"] {
    width: 100%;
    padding: 8px 36px 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 16px;
    font-weight: 600;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .dmy-date-field input[type="text"]:focus { border-color: var(--accent); }
  .dmy-picker-trigger {
    position: absolute;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    overflow: hidden;
  }
  .dmy-picker-trigger:hover { background: var(--subtle); color: var(--text); }
  .dmy-picker-trigger input[type="date"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  body:not([data-theme="dark"]) .btn:hover:not(:disabled) { filter: brightness(0.96); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .acc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: var(--card-shadow);
  }
  .acc-btn {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    text-align: left;
  }
  .acc-btn:hover { background: var(--subtle); }
  .acc-arrow { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
  .acc-card.open .acc-arrow { transform: rotate(180deg); }
  .acc-panel {
    display: none;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
  }
  .acc-card.open .acc-panel { display: block; }

  .side-page-link-btn {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .week-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 700;
  }
  .week-nav-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .week-step-btn {
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .week-step-btn:hover { border-color: var(--accent); }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; }
  .bar-label { width: 42px; font-weight: 700; white-space: nowrap; }
  .bar-track { flex: 1; height: 10px; background: var(--subtle); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: #22c55e; transition: width 0.3s; }
  body[data-theme="dark"] .bar-fill { background: #34d399; }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .month-nav button {
    background: var(--subtle);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
  .m-dow { font-size: 9px; font-weight: 700; text-align: center; color: var(--muted); }
  .m-day {
    aspect-ratio: 1;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    background: var(--subtle);
    color: var(--text);
  }
  .m-day.empty { background: transparent; }
  .m-day.lvl-red { background: #ef4444; color: #ffffff; }
  .m-day.lvl-orange { background: #f97316; color: #ffffff; }
  .m-day.lvl-green-light { background: #4ade80; color: #052e16; }
  .m-day.lvl-green-dark { background: #15803d; color: #ffffff; }

  .m-legend {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    margin-top: 8px;
    gap: 2px;
    flex-wrap: wrap;
  }
  .m-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    margin-right: 2px;
    vertical-align: middle;
  }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 12px;
  }
  .theme-opt {
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    text-align: center;
  }
  .theme-opt.active { outline: 2px solid var(--accent); border-color: var(--accent); }
  .col-manage-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

  .main {
    flex: 1;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 28px 84px;
    overflow-x: auto;
    min-width: 0;
    background: var(--bg);
    transition: background 0.2s ease;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toggle-btn {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .toggle-btn:hover:not(:disabled) { background: var(--subtle); }
  .toggle-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Floating Selection Quick-Bar */
  .selection-pop-wrap {
    position: fixed;
    z-index: 160;
    display: none;
    flex-direction: column;
    align-items: center;
    transform: translate(-50%, calc(-100% - 8px));
  }
  .selection-pop-bar {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 8px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
  }
  .selection-pop-bar button {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 7px;
    border-radius: 999px;
    cursor: pointer;
  }
  .selection-pop-bar button:hover { background: var(--subtle); }
  .emoji-quick-tray {
    display: none;
    gap: 4px;
    margin-top: 6px;
    padding: 5px 8px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
  }
  .emoji-quick-tray.open { display: flex; }
  .emoji-quick-tray button {
    border: none;
    background: transparent;
    font-size: 16px;
    padding: 2px 7px;
    border-radius: 6px;
    cursor: pointer;
  }
  .emoji-quick-tray button:hover { background: var(--subtle); }

  .page-title {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 16px 0;
    padding: 2px 4px;
    user-select: none;
    letter-spacing: -0.02em;
  }

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    background: var(--surface);
    box-shadow: var(--card-shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border: 1px solid var(--border);
    padding: 10px 12px;
    vertical-align: top;
    min-width: 210px;
    position: relative;
  }
  th { font-size: 13px; font-weight: 700; text-align: left; }

  body[data-theme="dark"] th { background-color: #162033 !important; color: #f1f5f9 !important; }
  body[data-theme="dark"] td.themed-cell { background-color: var(--surface) !important; color: var(--text) !important; }
  body[data-theme="yellow"] th,
  body[data-theme="yellow"] td.themed-cell { background-color: var(--surface) !important; color: var(--text) !important; }

  .date-cell {
    min-width: 145px;
    width: 145px;
    font-weight: 700;
    font-size: 13px;
    background: var(--date-bg) !important;
    color: var(--text) !important;
    white-space: nowrap;
  }
  .weekday-sub {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-left: 5px;
  }
  .del-date {
    float: right;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    border: none;
    background: none;
    padding: 0 4px;
  }
  .del-date:hover { color: #f87171; }

  .cell-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .status-btn {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    background: var(--bg);
    color: var(--text);
    flex-shrink: 0;
    user-select: none;
  }
  .status-done { background: #22c55e; color: #fff; border-color: #16a34a; }
  .status-cross { background: #ef4444; color: #fff; border-color: #dc2626; }
  .status-orange { background: #f97316; color: #fff; border-color: #ea580c; }

  .time-tag {
    font-size: 11px;
    color: var(--muted);
    background: var(--subtle);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    outline: none;
    min-width: 42px;
    margin-left: auto;
  }

  .sub-list { list-style: none; padding: 0; margin: 0 0 6px 0; display: flex; flex-direction: column; gap: 6px; }
  .sub-item { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; }
  .sub-text { flex: 1; outline: none; line-height: 1.4; word-break: break-word; }
  .sub-text.done { text-decoration: line-through; opacity: 0.6; }
  .sub-text.cross { color: #f87171; text-decoration: line-through; }
  .sub-text.orange { color: #fb923c; text-decoration: line-through; opacity: 0.82; }

  .add-sub {
    font-size: 11.5px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    font-weight: 600;
  }
  .add-sub:hover { color: var(--text); text-decoration: underline; }

  .notes-box { min-height: 60px; font-size: 13px; line-height: 1.5; outline: none; }
  .notes-box:empty:before { content: "Write notes..."; color: var(--muted); }

  .floating-page-pill {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .pill-nav-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    font-size: 14px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .pill-nav-btn:hover:not(:disabled) { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .pill-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .pill-page-label { font-size: 12px; font-weight: 700; padding: 0 4px; white-space: nowrap; }

  .subpage-pager {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .subpage-pager button {
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .subpage-pager button:disabled { opacity: 0.35; cursor: not-allowed; }

  .subpage-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    max-width: 920px;
    box-shadow: var(--card-shadow);
  }
  .subpage-card.active { display: block; }
  .subpage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .subpage-header h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .header-actions-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .plus-circle-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    font-size: 17px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .plus-circle-btn:hover { border-color: var(--accent); background: var(--surface); }

  .declutter-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .declutter-input-row input[type="date"] {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }

  .tl-time-text-input {
    width: 158px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
    font-family: inherit;
  }
  .tl-time-text-input:focus { border-color: var(--accent); }
  .tl-time-text-input::placeholder { color: var(--muted); }

  .rich-input-box {
    flex: 1;
    min-width: 180px;
    min-height: 42px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.4;
    outline: none;
    word-break: break-word;
  }
  .rich-input-box:focus { border-color: var(--accent); }
  .rich-input-box:empty:before {
    content: attr(data-placeholder);
    color: var(--muted);
    pointer-events: none;
  }

  .declutter-bullets {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .declutter-bullet-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--subtle);
    border: 1px solid var(--border);

<script>
function getLocalTodayISO() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function isoFromDateObj(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getMondayOfWeek(isoStr) {
  const parts = String(isoStr || '').split('-').map(Number);
  const dt = (parts.length === 3) ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date();
  const day = dt.getDay();
  const diffToMon = (day + 6) % 7;
  dt.setDate(dt.getDate() - diffToMon);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

function getWeekdayIndex(isoStr) {
  const parts = String(isoStr || '').split('-').map(Number);
  if (parts.length !== 3) return 0;
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  return Number.isNaN(dt.getTime()) ? 0 : dt.getDay();
}

const TODAY = getLocalTodayISO();
const WEEKDAYS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON_SUN_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const DIVE_PALETTE = [
  '#dbeafe',
  '#dcfce7',
  '#fae8ff',
  '#ffedd5',
  '#e0f2fe',
  '#fce7f3'
];

const DIVE_DARK_PALETTE = [
  '#dbeafe',
  '#cfe3ff',
  '#e0f2fe',
  '#d4e6ff',
  '#cbe0fd',
  '#e2edff'
];

const SECTION_TINTS = {
  white: ['#f8fafc', '#f0fdf4', '#eff6ff', '#fdf4ff', '#fffbeb', '#f0fdfa'],
  yellow: ['#fef9c3', '#fef3c7', '#ecfccb', '#ffedd5', '#e0f2fe', '#fce7f3'],
  dark: ['#dbeafe', '#cfe3ff', '#e0f2fe', '#d4e6ff', '#cbe0fd', '#e2edff']
};

const TIMELINE_EVENT_COLORS = [
  '#bae6fd',
  '#bbf7d0',
  '#fed7aa',
  '#ddd6fe',
  '#fbcfe8',
  '#fde68a'
];

const SUBPAGE_SIZE = 8;
const DIVE_BLOCK_PAGE_SIZE = 8;

let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let weekAnchorMonday = getMondayOfWeek(TODAY);
let tlCalYear = new Date().getFullYear();
let tlCalMonth = new Date().getMonth();
let yourCalendarOpen = false;
let recurPopoverOpen = false;
let selectedTimelineDate = null;
let selectedLogDateISO = TODAY;
let pendingPhotoTarget = null;
let savedSelectionRange = null;
let openSectionMenuId = null;
let openNoteMenuId = null;
let openGoalMenu = false;
let renamingGoalActive = false;
let editingSectionTitleId = null;
let editingSubsectionTitleId = null;
let editingNoteId = null;
let goalTasksCollapsed = true;

let dymPage = 1;
let diveSpacesPage = 1;

let currentView = 'matrix';
let activeGoalId = null;
let activeDiveSpaceId = null;
let matrixPage = null;
let pageSlices = [];

const DEFAULT_DATA = {
  title: "Iqra's Productivity Matrix",
  theme: "white",
  dates: [TODAY],
  notesColor: "#fffbeb",
  columns: [
    { id: 'c1', name: 'Study', color: '#eff6ff' },
    { id: 'c2', name: 'Work / Projects', color: '#f0fdf4' },
    { id: 'c3', name: 'Personal & Health', color: '#fdf4ff' }
  ],
  records: {},
  notes: {},
  braindump: [],
  timeline: [],
  calendarRecurring: [],
  goals: [],
  diveSpaces: []
};

function normalizeState(rawObj) {
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if (!rawObj || typeof rawObj !== 'object') return base;

  const merged = { ...base, ...rawObj };
  if (!merged.theme) merged.theme = "white";
  if (!Array.isArray(merged.braindump)) merged.braindump = [];
  if (!Array.isArray(merged.timeline)) merged.timeline = [];
  if (!Array.isArray(merged.calendarRecurring)) merged.calendarRecurring = [];
  if (!Array.isArray(merged.goals)) merged.goals = [];
  if (!Array.isArray(merged.diveSpaces)) merged.diveSpaces = [];

  merged.timeline = merged.timeline.map((ev, idx) => ({
    id: ev.id || ('tl' + idx + '_' + Date.now()),
    date: ev.date || TODAY,
    time: typeof ev.time === 'string' ? ev.time : '',
    endTime: typeof ev.endTime === 'string' ? ev.endTime : '',
    activity: ev.activity || '',
    status: Number(ev.status) || 0
  }));

  merged.calendarRecurring = merged.calendarRecurring.map((rev, idx) => {
    const startDate = rev.startDate || rev.date || TODAY;
    return {
      id: rev.id || ('rec' + idx + '_' + Date.now()),
      startDate,
      weekday: typeof rev.weekday === 'number' ? rev.weekday : getWeekdayIndex(startDate),
      time: typeof rev.time === 'string' ? rev.time : '',
      title: rev.title || ''
    };
  });

  merged.diveSpaces = merged.diveSpaces.map((sp, idx) => ({
    id: sp.id || ('ds' + idx + '_' + Date.now()),
    name: sp.name || ('Block ' + (idx + 1)),
    color: sp.color || DIVE_PALETTE[idx % DIVE_PALETTE.length],
    sections: Array.isArray(sp.sections)
      ? sp.sections.map((sec, sIdx) => ({
          id: sec.id || ('sec_' + sIdx + '_' + Date.now()),
          title: sec.title || ('Section ' + (sIdx + 1)),
          collapsed: true,
          bullets: Array.isArray(sec.bullets) ? sec.bullets : [],
          plainBullets: Array.isArray(sec.plainBullets) ? sec.plainBullets : [],
          subsections: Array.isArray(sec.subsections)
            ? sec.subsections.map((sub, uIdx) => ({
                id: sub.id || ('subsec_' + uIdx + '_' + Date.now()),
                title: sub.title || ('Subsection ' + (uIdx + 1)),
                collapsed: true,
                bullets: Array.isArray(sub.bullets) ? sub.bullets : []
              }))
            : [],
          photos: Array.isArray(sec.photos) ? sec.photos : [],
          notes: Array.isArray(sec.notes)
            ? sec.notes.map((n, nIdx) => ({
                id: n.id || ('note_' + nIdx + '_' + Date.now()),
                text: n.text || '',
                timesNewRoman: true,
                expanded: false
              }))
            : []
        }))
      : []
  }));

  const validDates = Array.isArray(merged.dates)
    ? merged.dates
        .map(d => String(d).split('_')[0])
        .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d))
    : [TODAY];

  merged.dates = Array.from(new Set(validDates.length ? validDates : [TODAY])).sort();
  return merged;
}

let state = normalizeState(JSON.parse(localStorage.getItem('iqraMatrixCleanV1')));
let undoStack = [];

function formatDateDMY(isoStr) {
  const clean = String(isoStr || '').split('_')[0];
  const parts = clean.split('-');
  if (parts.length !== 3) return clean;
  return `${Number(parts[2])}/${Number(parts[1])}/${parts[0]}`;
}

function formatDateDMShort(isoStr) {
  const clean = String(isoStr || '').split('_')[0];
  const parts = clean.split('-');
  if (parts.length !== 3) return clean;
  return `${Number(parts[2])}/${Number(parts[1])}`;
}

function parseDmyToISO(dmyStr) {
  const cleaned = String(dmyStr || '').trim().replace(/[.\-]/g, '/');
  const m = cleaned.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const day = Number(m[1]);
  const month = Number(m[2]);
  const year = Number(m[3]);
  if (month < 1 || month > 12 || day < 1 || day > 31) return null;
  const dt = new Date(year, month - 1, day);
  if (dt.getFullYear() !== year || dt.getMonth() !== month - 1 || dt.getDate() !== day) return null;
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

  }
}

document.getElementById('recurDateInput').value = TODAY;

function getWeekdayShort(isoStr) {
  const clean = String(isoStr || '').split('_')[0];
  const parts = clean.split('-').map(Number);
  if (parts.length !== 3) return '';
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  if (Number.isNaN(dt.getTime())) return '';
  return WEEKDAYS_SHORT[dt.getDay()];
}

function formatEventTimeDisplay(ev) {
  const start = (ev.time || '').trim();
  const end = (ev.endTime || '').trim();
  if (start && end) return `${start} – ${end}`;
  if (start) return start;
  if (end) return end;
  return '';
}

function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 40) undoStack.shift();
  updateUndoBtn();
}

function updateUndoBtn() {
  const btn = document.getElementById('undoBtn');
  if (btn) btn.disabled = undoStack.length === 0;
}

function undoLastAction() {
  if (undoStack.length === 0) return;
  state = normalizeState(JSON.parse(undoStack.pop()));
  updateUndoBtn();
  save();
  render();
}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    const tag = document.activeElement ? document.activeElement.tagName : '';
    const isEdit = document.activeElement && document.activeElement.isContentEditable;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isEdit) {
      e.preventDefault();
      undoLastAction();
    }
  }
});

function insertEmojiAtCaret(emoji) {
  const wrap = document.getElementById('selectionPopWrap');
  const editable = wrap?._targetEditable;
  if (editable) {
    editable.focus();
    const sel = window.getSelection();
    if (savedSelectionRange && sel) {
      sel.removeAllRanges();
      sel.addRange(savedSelectionRange);
    }
    document.execCommand('insertText', false, emoji);
  }
  hideSelectionBar();
}

function hideSelectionBar() {
  const wrap = document.getElementById('selectionPopWrap');
  const tray = document.getElementById('emojiQuickTray');
  if (tray) tray.classList.remove('open');
  if (wrap) {
    wrap.style.display = 'none';
    wrap._targetEditable = null;
  }
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  const wrap = document.getElementById('selectionPopWrap');
  if (!sel || !wrap || sel.isCollapsed || !sel.rangeCount) return;
  const anchorNode = sel.anchorNode;
  const host = anchorNode ? (anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement) : null;
  const editable = host ? host.closest('[contenteditable="true"]') : null;
  if (!editable || !sel.toString().trim()) return;
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  if (!rect.width && !rect.height) return;

  savedSelectionRange = range.cloneRange();
  wrap._targetEditable = editable;
  wrap.style.left = `${Math.max(70, Math.min(window.innerWidth - 70, rect.left + rect.width / 2))}px`;
  wrap.style.top = `${Math.max(46, rect.top)}px`;
  wrap.style.display = 'flex';
});

document.addEventListener('mousedown', (e) => {
  const wrap = document.getElementById('selectionPopWrap');
  if (wrap && !wrap.contains(e.target)) {
    hideSelectionBar();
  }
  let rerenderDive = false;
  if (!e.target.closest('.sec-menu-wrap') && openSectionMenuId) {
    openSectionMenuId = null;
    rerenderDive = true;
  }
  if (!e.target.closest('.note-more-wrap') && openNoteMenuId) {
    openNoteMenuId = null;
    rerenderDive = true;
  }
  if (rerenderDive && currentView === 'diveSpaceDetail') {

  if (!e.target.closest('.goal-menu-wrap') && openGoalMenu) {
    openGoalMenu = false;

  }
  if (!e.target.closest('.your-cal-bar') && (yourCalendarOpen || recurPopoverOpen)) {
    closeFloatingTimelinePopups();
  }
});

(function setupSwipe() {
  const sb = document.getElementById('sidebar');
  const edge = document.getElementById('edgeSwipeZone');
  let startX = 0, startY = 0, curX = 0, swipingClose = false, swipingOpen = false;

  sb.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 768 || sb.classList.contains('closed')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    curX = startX;
    swipingClose = true;
    sb.style.transition = 'none';
  }, { passive: true });

  sb.addEventListener('touchmove', (e) => {
    if (!swipingClose) return;
    curX = e.touches[0].clientX;
    const dx = curX - startX;
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dx < 0 && Math.abs(dx) > dy * 0.9) {
      sb.style.transform = `translateX(${dx}px)`;
    }
  }, { passive: true });

  sb.addEventListener('touchend', () => {
    if (!swipingClose) return;
    swipingClose = false;
    sb.style.transition = '';
    if (curX - startX < -55) closeSidebar();
    else sb.style.transform = '';
  });

  edge.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 768 || !sb.classList.contains('closed')) return;
    startX = e.touches[0].clientX;
    curX = startX;
    swipingOpen = true;
  }, { passive: true });

  edge.addEventListener('touchmove', (e) => {
    if (!swipingOpen) return;
    curX = e.touches[0].clientX;
  }, { passive: true });

  edge.addEventListener('touchend', () => {
    if (!swipingOpen) return;
    swipingOpen = false;
    if (curX - startX > 45) openSidebar();
  });
})();

function updateFloatingPaginationVisibility() {
  const totalPages = Math.max(1, pageSlices.length);
  const pagBar = document.getElementById('matrixPagination');
  const activePage = matrixPage || totalPages;

  if (currentView === 'matrix' && totalPages > 1) {
    pagBar.style.display = 'inline-flex';
    document.getElementById('pageIndicator').innerText = `${activePage} / ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = (activePage <= 1);
    document.getElementById('nextPageBtn').disabled = (activePage >= totalPages);
  } else {
    pagBar.style.display = 'none';
  }
}

function renderInlinePager(containerId, currentPage, totalItems, pageSize, onPageChangeFnName) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
  if (totalPages <= 1) {
    el.innerHTML = '';
    return;
  }
  const safePage = Math.min(totalPages, Math.max(1, currentPage));
  el.innerHTML = `
    <button type="button" onclick="${onPageChangeFnName}(${safePage - 1})" ${safePage <= 1 ? 'disabled' : ''}>‹</button>
    <span>${safePage} / ${totalPages}</span>
    <button type="button" onclick="${onPageChangeFnName}(${safePage + 1})" ${safePage >= totalPages ? 'disabled' : ''}>›</button>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function stripHtmlToText(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || div.innerText || '').trim();
}

/* Declutter Your Mind */
function addDeclutterBullet() {
  const inp = document.getElementById('declutterInput');
  const plain = inp.innerText.trim();
  const html = inp.innerHTML.trim();
  if (!plain) return;
  pushUndo();
  state.braindump.unshift({ text: html, struck: false });
  dymPage = 1;
  inp.innerHTML = '';
  save();
  renderDeclutterList();
}

function toggleDeclutterBullet(idx) {
  if (!state.braindump[idx]) return;
  pushUndo();
  state.braindump[idx].struck = !state.braindump[idx].struck;
  save();
  renderDeclutterList();
}

function editDeclutterBullet(idx, newHtml) {
  if (!state.braindump[idx] || state.braindump[idx].text === newHtml) return;
  pushUndo();
  state.braindump[idx].text = newHtml;
  save();
}

function deleteDeclutterBullet(idx) {
  pushUndo();
  state.braindump.splice(idx, 1);
  save();
  renderDeclutterList();
}

function setDymPage(p) {
  dymPage = p;
  renderDeclutterList();
}

function renderDeclutterList() {
  const ul = document.getElementById('declutterList');
  if (!state.braindump.length) {
    ul.innerHTML = '';
    renderInlinePager('dymPager', 1, 0, SUBPAGE_SIZE, 'setDymPage');
    return;
  }
  const totalPages = Math.max(1, Math.ceil(state.braindump.length / SUBPAGE_SIZE));
  if (dymPage > totalPages) dymPage = totalPages;
  const start = (dymPage - 1) * SUBPAGE_SIZE;
  const slice = state.braindump.slice(start, start + SUBPAGE_SIZE);

  ul.innerHTML = slice.map((item, offsetIdx) => {
    const idx = start + offsetIdx;
    return `
      <li class="declutter-bullet-item ${item.struck ? 'struck' : ''}">
        <div class="declutter-bullet-text" contenteditable="true" onblur="editDeclutterBullet(${idx}, this.innerHTML)">${item.text}</div>
        <button type="button" class="dym-line-btn" onclick="toggleDeclutterBullet(${idx})" title="${item.struck ? 'Restore' : 'Line through'}">${item.struck ? '↺' : '—'}</button>
        <button type="button" class="del-date" style="float:none;" onclick="deleteDeclutterBullet(${idx})" title="Delete">×</button>
      </li>
    `;
  }).join('');

  renderInlinePager('dymPager', dymPage, state.braindump.length, SUBPAGE_SIZE, 'setDymPage');
}

/* Your Upcoming Timeline + Floating Popups */
function addTimelineItem() {
  const d = document.getElementById('tlDateInput').value;
  const timeText = (document.getElementById('tlTimeTextInput').value || '').trim();
  const inp = document.getElementById('tlActivityInput');
  const plain = inp.innerText.trim();
  const html = inp.innerHTML.trim();
  if (!d || !plain) return;

  pushUndo();
  state.timeline.push({
    id: 'tl' + Date.now(),
    date: d,
    time: timeText,
    endTime: '',
    activity: html,
    status: 0
  });
  state.timeline.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
  const parts = d.split('-').map(Number);
  if (parts.length === 3) {
    tlCalYear = parts[0];
    tlCalMonth = parts[1] - 1;
  }
  inp.innerHTML = '';
  document.getElementById('tlTimeTextInput').value = '';
  save();
  renderTimelineSection();
}

      </div>
    `;
  }).join('');

function getCalendarEntriesForDate(isoDate) {
  const list = [];
  state.timeline.forEach(ev => {
    if (ev.date === isoDate) {
      list.push({
        label: stripHtmlToText(ev.activity) || 'Event',
        time: formatEventTimeDisplay(ev)
      });
    }
  });
  const wd = getWeekdayIndex(isoDate);
  state.calendarRecurring.forEach(rev => {
    const start = rev.startDate || TODAY;
    const rWd = typeof rev.weekday === 'number' ? rev.weekday : getWeekdayIndex(start);
    if (isoDate >= start && wd === rWd) {
      list.push({
        label: rev.title,
        time: rev.time || ''
      });
    }
  });
  return list;
}

function shiftTimelineCal(delta) {
  tlCalMonth += delta;
  if (tlCalMonth < 0) { tlCalMonth = 11; tlCalYear--; }
  if (tlCalMonth > 11) { tlCalMonth = 0; tlCalYear++; }
  selectedTimelineDate = null;
  renderTimelineCalendar();
}

  renderTimelineCalendar();
}

function getDateColor(isoDate) {
  let hash = 0;
  for (let i = 0; i < isoDate.length; i++) {
    hash = ((hash << 5) - hash) + isoDate.charCodeAt(i);
    hash |= 0;
  }
  return TIMELINE_EVENT_COLORS[Math.abs(hash) % TIMELINE_EVENT_COLORS.length];
}

function renderTimelineCalendar() {
  syncTimelinePanels();
  if (!yourCalendarOpen) return;

  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const labelEl = document.getElementById('tlCalMonthLabel');
  const gridEl = document.getElementById('tlCalendarGrid');
  const detailBox = document.getElementById('tlSelectedEventsBox');
  if (!labelEl || !gridEl || !detailBox) return;

  labelEl.textContent = `${monthNames[tlCalMonth]} ${tlCalYear}`;

  const eventsByDate = {};
  const daysInMonth = new Date(tlCalYear, tlCalMonth + 1, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${tlCalYear}-${String(tlCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const entries = getCalendarEntriesForDate(dStr);
    if (entries.length) eventsByDate[dStr] = entries;
  }

  const dows = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let html = dows.map(d => `<div class="tl-cal-dow">${d}</div>`).join('');

  const firstDay = new Date(tlCalYear, tlCalMonth, 1).getDay();
  const offset = (firstDay + 6) % 7;
  for (let i = 0; i < offset; i++) {
    html += `<div class="tl-cal-day empty"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${tlCalYear}-${String(tlCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dStr] || [];
    const hasEv = dayEvents.length > 0;
    const isSel = selectedTimelineDate === dStr;
    const isToday = dStr === TODAY;
    const bgColor = hasEv ? getDateColor(dStr) : '';

    html += `
      <button
        type="button"
        class="tl-cal-day ${hasEv ? 'has-event' : ''} ${isSel ? 'selected-day' : ''} ${isToday ? 'today-ring' : ''}"
        style="${hasEv ? `background:${bgColor};` : ''}"
        onclick="selectTimelineCalendarDate('${dStr}')"
      >${day}</button>
    `;
  }
  gridEl.innerHTML = html;

  const selEvents = selectedTimelineDate ? (eventsByDate[selectedTimelineDate] || []) : [];
  if (!selectedTimelineDate || !selEvents.length) {
    detailBox.style.display = 'none';
    detailBox.innerHTML = '';
    return;
  }

  const badgeColor = getDateColor(selectedTimelineDate);
  detailBox.style.display = 'flex';
  detailBox.innerHTML = selEvents.map(ev => {
    const timePart = ev.time ? `<span class="tl-time-badge">${escapeHtml(ev.time)}</span>` : '';
    return `<span class="tl-event-only-pill" style="background:${badgeColor};">${escapeHtml(ev.label)}${timePart}</span>`;
  }).join('');
}

function renderTimelineTable() {
  const tbody = document.getElementById('timelineBody');
  state.timeline.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));

  if (!state.timeline.length) {
    tbody.innerHTML = '';
    return;
  }

  tbody.innerHTML = state.timeline.map(item => {
    const sym = item.status === 1 ? '✓' : item.status === 2 ? '✗' : '';
    const cls = item.status === 1 ? 'status-done' : item.status === 2 ? 'status-cross' : '';
    const txtCls = item.status === 1 ? 'tl-done' : item.status === 2 ? 'tl-crossed' : '';
    const wk = getWeekdayShort(item.date);
    const timeStr = formatEventTimeDisplay(item);

    return `
      <tr>
        <td style="text-align:center;">
          <span class="status-btn ${cls}" onclick="toggleTimelineStatus('${item.id}')">${sym}</span>
        </td>
        <td style="font-weight:700; white-space:nowrap;">${formatDateDMY(item.date)} <span style="color:var(--muted); font-size:12px;">(${wk})</span></td>
        <td style="font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; user-select:none;">${timeStr ? escapeHtml(timeStr) : '—'}</td>
        <td class="${txtCls}" contenteditable="true" onblur="updateTimelineActivity('${item.id}', this.innerHTML)" style="outline:none;">${item.activity}</td>
        <td style="text-align:center;">
          <button type="button" class="del-date" style="float:none;" onclick="deleteTimelineItem('${item.id}')" title="Remove">×</button>
        </td>

  }).join('');
}

  if (!state.goals.length) {
    wrap.innerHTML = '';
    return;

  wrap.innerHTML = state.goals.map(g => {
    const evaluatedTasks = g.tasks.filter(t => t.status === 1 || t.status === 0);
    const tickedCount = evaluatedTasks.filter(t => t.status === 1).length;
    const pct = (evaluatedTasks.length === 0 || tickedCount === 0)
      ? 0
      : Math.round((tickedCount / evaluatedTasks.length) * 100);

    return `
      <div class="bar-row" style="margin-bottom:8px;">
        <span class="bar-label" style="width:82px;" title="${escapeHtml(g.name)}">${escapeHtml(g.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>

    `;

}

/* Dive Into Blocks + Collapsible Sections + Dropdown Actions */
function getThemedBlockBg(sp, index) {
  const theme = state.theme || 'white';
  if (theme === 'dark') {
    return DIVE_DARK_PALETTE[index % DIVE_DARK_PALETTE.length];
  }
  if (theme === 'yellow') {
    const warmShades = ['#fde68a', '#fef08a', '#fed7aa', '#fbcfe8', '#d9f99d', '#fde047'];
    return warmShades[index % warmShades.length];
  }
  return sp.color || DIVE_PALETTE[index % DIVE_PALETTE.length];
}

function getSectionTint(secIndex) {
  const t = state.theme || 'white';
  const palette = SECTION_TINTS[t] || SECTION_TINTS.white;
  return palette[secIndex % palette.length];
}

function renderDiveSpacesGrid() {
  const grid = document.getElementById('diveSpacesGrid');
  if (!grid) return;

  if (!state.diveSpaces.length) {
    grid.innerHTML = '';
    renderInlinePager('diveSpacesPager', 1, 0, DIVE_BLOCK_PAGE_SIZE, 'setDiveSpacesPage');
    return;
  }

  const totalPages = Math.max(1, Math.ceil(state.diveSpaces.length / DIVE_BLOCK_PAGE_SIZE));
  if (diveSpacesPage > totalPages) diveSpacesPage = totalPages;
  const start = (diveSpacesPage - 1) * DIVE_BLOCK_PAGE_SIZE;
  const slice = state.diveSpaces.slice(start, start + DIVE_BLOCK_PAGE_SIZE);

  grid.innerHTML = slice.map((sp, offsetIdx) => {
    const globalIdx = start + offsetIdx;
    const bg = getThemedBlockBg(sp, globalIdx);
    return `
      <div class="dive-folder-card" style="background:${bg};" onclick="openSubpage('diveSpaceDetail', '${sp.id}')">
        <button type="button" class="dive-del-corner" onclick="deleteDiveSpace('${sp.id}', event)" title="Delete">×</button>
        <div class="dive-folder-name">${escapeHtml(sp.name)}</div>
      </div>

  }).join('');

  renderInlinePager('diveSpacesPager', diveSpacesPage, state.diveSpaces.length, DIVE_BLOCK_PAGE_SIZE, 'setDiveSpacesPage');

  });
}

function addTickBullet(secId, subId = null, focusNew = false) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec) return;
  pushUndo();
  openSectionMenuId = null;
  sec.collapsed = false;
  const newBullet = {
    id: 'bul_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    text: '',
    ticked: false
  };
  if (subId) {
    const sub = sec.subsections.find(u => u.id === subId);
    if (!sub) return;
    sub.collapsed = false;
    sub.bullets.push(newBullet);
  } else {
    sec.bullets.push(newBullet);
  }
  save();
  renderDiveSpaceDetail();
  if (focusNew) focusBulletElementById(newBullet.id);
}

function handleTickBulletKeydown(ev, secId, subId, bulId, el) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec) return;
  const list = subId ? sec.subsections.find(u => u.id === subId)?.bullets : sec.bullets;
  const idx = list?.findIndex(b => b.id === bulId) ?? -1;
  if (idx === -1) return;

  const plain = (el.innerText || '').trim();
  if (ev.key === 'Enter') {
    ev.preventDefault();
    if (!plain) {
      list.splice(idx, 1);
      save();
      renderDiveSpaceDetail();
      return;
    }
    list[idx].text = el.innerHTML;
    const nextBullet = {
      id: 'bul_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
      text: '',
      ticked: false
    };
    list.splice(idx + 1, 0, nextBullet);
    save();
    renderDiveSpaceDetail();
    focusBulletElementById(nextBullet.id);
    return;
  }

  if ((ev.key === 'Backspace' || ev.key === 'Delete') && !plain) {
    ev.preventDefault();
    const prevBullet = list[idx - 1];
    list.splice(idx, 1);
    save();
    renderDiveSpaceDetail();
    if (prevBullet) focusBulletElementById(prevBullet.id);
  }
}

function toggleTickBullet(secId, subId, bulId) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec) return;
  const list = subId ? sec.subsections.find(u => u.id === subId)?.bullets : sec.bullets;
  const item = list?.find(b => b.id === bulId);
  if (!item) return;
  pushUndo();
  item.ticked = !item.ticked;
  save();
  renderDiveSpaceDetail();
}

  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec) return;
  const list = subId ? sec.subsections.find(u => u.id === subId)?.bullets : sec.bullets;
  const item = list?.find(b => b.id === bulId);
  if (!item || item.text === htmlVal) return;
  pushUndo();
  item.text = htmlVal;
  save();
}

  };

function handlePlainBulletKeydown(ev, secId, pbulId, el) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec || !Array.isArray(sec.plainBullets)) return;
  const idx = sec.plainBullets.findIndex(b => b.id === pbulId);
  if (idx === -1) return;

  const plain = (el.innerText || '').trim();
  if (ev.key === 'Enter') {
    ev.preventDefault();
    if (!plain) {
      sec.plainBullets.splice(idx, 1);
      save();
      renderDiveSpaceDetail();
      return;
    }
    sec.plainBullets[idx].text = el.innerHTML;
    const nextItem = {
      id: 'pbul_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
      text: ''
    };
    sec.plainBullets.splice(idx + 1, 0, nextItem);
    save();
    renderDiveSpaceDetail();
    focusBulletElementById(nextItem.id);
    return;
  }

  if ((ev.key === 'Backspace' || ev.key === 'Delete') && !plain) {
    ev.preventDefault();
    const prevItem = sec.plainBullets[idx - 1];
    sec.plainBullets.splice(idx, 1);
    save();
    renderDiveSpaceDetail();
    if (prevItem) focusBulletElementById(prevItem.id);
  }
}

function editPlainBulletText(secId, pbulId, htmlVal) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  const item = sec?.plainBullets?.find(b => b.id === pbulId);
  if (!item || item.text === htmlVal) return;
  pushUndo();
  item.text = htmlVal;
  save();
}

function addSectionNote(secId) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec) return;
  pushUndo();
  openSectionMenuId = null;
  sec.collapsed = false;
  if (!Array.isArray(sec.notes)) sec.notes = [];
  sec.notes.push({
    id: 'note_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    text: '',
    timesNewRoman: true,
    expanded: false
  });
  save();
  renderDiveSpaceDetail();
}

function toggleSectionNoteExpanded(secId, noteId) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  const note = sec?.notes?.find(n => n.id === noteId);
  if (!note) return;
  note.expanded = !note.expanded;
  if (!note.expanded && editingNoteId === noteId) {
    editingNoteId = null;
  }
  openNoteMenuId = null;
  localStorage.setItem('iqraMatrixCleanV1', JSON.stringify(state));
  renderDiveSpaceDetail();
}

function startEditingNote(noteId) {
  editingNoteId = noteId;
  renderDiveSpaceDetail();
  requestAnimationFrame(() => {
    const area = document.querySelector(`[data-note-area="${noteId}"]`);
    if (area) area.focus();
  });
}

function editSectionNoteText(secId, noteId, htmlVal) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  const note = sec?.notes?.find(n => n.id === noteId);
  if (editingNoteId === noteId) editingNoteId = null;
  const cleaned = (htmlVal || '').replace(/<b>\s*(<br>)?\s*<\/b>/gi, '').trim();
  if (!note || note.text === cleaned) return;
  pushUndo();
  note.text = cleaned;
  save();
}

function deleteSectionNote(secId, noteId) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec || !Array.isArray(sec.notes)) return;
  pushUndo();
  openNoteMenuId = null;
  if (editingNoteId === noteId) editingNoteId = null;
  sec.notes = sec.notes.filter(n => n.id !== noteId);
  save();
  renderDiveSpaceDetail();
}

function triggerBlockPhoto(secId) {
  pendingPhotoTarget = secId;
  openSectionMenuId = null;
  const picker = document.getElementById('blockPhotoFileInput');
  if (picker) {
    picker.value = '';
    picker.click();
  }
}

function onBlockPhotoPicked(inputEl) {
  const file = inputEl?.files?.[0];
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === pendingPhotoTarget);
  pendingPhotoTarget = null;
  if (!file || !sec) return;

  const reader = new FileReader();
  reader.onload = () => {
    if (typeof reader.result !== 'string') return;
    pushUndo();
    sec.collapsed = false;
    if (!Array.isArray(sec.photos)) sec.photos = [];
    sec.photos.push({
      id: 'pic_' + Date.now(),
      src: reader.result
    });
    save();
    renderDiveSpaceDetail();
  };
  reader.readAsDataURL(file);
}

function deleteBlockPhoto(secId, picId) {
  const sp = getActiveDiveSpace();
  const sec = sp?.sections.find(s => s.id === secId);
  if (!sec || !Array.isArray(sec.photos)) return;
  pushUndo();
  sec.photos = sec.photos.filter(p => p.id !== picId);
  save();
  renderDiveSpaceDetail();
}

function renderBulletsHtml(secId, subId, bullets) {
  if (!Array.isArray(bullets) || !bullets.length) return '';
  const subArg = subId ? `'${subId}'` : 'null';
  return bullets.map(b => `
    <div class="tick-bullet-row">
      <button type="button" class="tick-box-btn ${b.ticked ? 'ticked' : ''}" onclick="toggleTickBullet('${secId}', ${subArg}, '${b.id}')">${b.ticked ? '✓' : ''}</button>
      <div class="tick-bullet-text" data-bul-id="${b.id}" contenteditable="true" onkeydown="handleTickBulletKeydown(event, '${secId}', ${subArg}, '${b.id}', this)" onblur="editTickBulletText('${secId}', ${subArg}, '${b.id}', this.innerHTML)">${b.text || ''}</div>
    </div>
  `).join('');
}

function renderPlainBulletsHtml(secId, plainBullets) {
  if (!Array.isArray(plainBullets) || !plainBullets.length) return '';
  return plainBullets.map(b => `
    <div class="tick-bullet-row">
      <span class="plain-bullet-dot">•</span>
      <div class="tick-bullet-text" data-bul-id="${b.id}" contenteditable="true" onkeydown="handlePlainBulletKeydown(event, '${secId}', '${b.id}', this)" onblur="editPlainBulletText('${secId}', '${b.id}', this.innerHTML)">${b.text || ''}</div>

function renderNotesHtml(secId, notes) {
  if (!Array.isArray(notes) || !notes.length) return '';
  const chipsHtml = notes.map(n => `
    <button type="button" class="sticky-note-chip" onclick="toggleSectionNoteExpanded('${secId}', '${n.id}')" title="Toggle note">📝</button>
  `).join('');

  const expandedCardsHtml = notes.filter(n => n.expanded).map(n => {

/* Title (Editable ONLY from Customize Matrix menu) */
function updateTitle(val) {
  const clean = val.trim() || "Iqra's Productivity Matrix";
  if (clean === state.title) return;
  pushUndo();
  state.title = clean;
  document.title = clean;
  document.getElementById('pageTitle').innerText = clean;
  save();
}

function addDateRow() {
  const textEl = document.getElementById('dateDmyInput');
  const parsedFromText = textEl ? parseDmyToISO(textEl.value) : null;
  const d = parsedFromText || selectedLogDateISO || document.getElementById('dateInput').value;
  if (!d) return;
  setLogDateControls(d);

  if (!state.dates.includes(d)) {
    pushUndo();
    state.dates.push(d);
    state.dates.sort();
    save();
    openSubpage('matrix', null);
    const idx = state.dates.indexOf(d);
    const targetPageIdx = pageSlices.findIndex(([s, e]) => idx >= s && idx < e);
    if (targetPageIdx !== -1) {
      matrixPage = targetPageIdx + 1;
      renderTableOnly();
    }
  } else {
    openSubpage('matrix');
  }
}

function removeDateRow(d) {
  pushUndo();
  state.dates = state.dates.filter(item => item !== d);
  delete state.notes[d];
  Object.keys(state.records).forEach(k => { if (k.startsWith(d + '_')) delete state.records[k]; });
  save();
  render();
}

function changeMatrixPage(delta) {
  const totalPages = Math.max(1, pageSlices.length);
  const current = matrixPage || totalPages;
  matrixPage = Math.min(totalPages, Math.max(1, current + delta));
  renderTableOnly();
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
}

function addColumn() {
  const name = prompt('New column name:');
  if (!name) return;
  pushUndo();
  state.columns.push({ id: 'c' + Date.now(), name: name.trim(), color: '#f8fafc' });
  save();
  render();
}

function deleteColumn(id) {
  if (state.columns.length <= 1) return;
  pushUndo();
  state.columns = state.columns.filter(c => c.id !== id);
  save();
  render();
}

function updateColName(id, val) {
  const col = state.columns.find(c => c.id === id);
  if (col && val.trim() && col.name !== val.trim()) {
    pushUndo();
    col.name = val.trim();
    save();
    renderTableOnly();
  }
}

function updateColColor(id, val) {
  const col = state.columns.find(c => c.id === id);
  if (col && col.color !== val) {
    pushUndo();
    col.color = val;
    save();
    renderTableOnly();
  }
}

function updateNotesColor(val) {
  if (state.notesColor === val) return;
  pushUndo();
  state.notesColor = val;
  save();
  renderTableOnly();
}

function cycleStatus(s) { return ((s || 0) + 1) % 4; }
function statusSymbol(s) { return s === 1 ? '✓' : s === 2 ? '✗' : s === 3 ? '—' : ''; }
function statusClass(s) { return s === 1 ? 'status-done' : s === 2 ? 'status-cross' : s === 3 ? 'status-orange' : ''; }

function getCell(date, colId) {
  const key = `${date}_${colId}`;
  if (!state.records[key]) state.records[key] = { status: 0, time: '', subs: [] };
  return state.records[key];
}

function renderSidebarControls() {
  document.getElementById('titleInput').value = state.title;
  setLogDateControls(selectedLogDateISO || TODAY);

  const mgr = document.getElementById('colManager');
  mgr.innerHTML = state.columns.map(col => `
    <div class="col-manage-row">
      <input type="color" value="${col.color}" onchange="updateColColor('${col.id}', this.value)" style="width:26px;height:26px;border:none;background:none;cursor:pointer;">
      <input type="text" value="${escapeHtml(col.name)}" onchange="updateColName('${col.id}', this.value)" class="side-input" style="margin:0;">
      <button type="button" onclick="deleteColumn('${col.id}')" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;">×</button>
    </div>`).join('') + `
    <div class="col-manage-row">
      <input type="color" value="${state.notesColor}" onchange="updateNotesColor(this.value)" style="width:26px;height:26px;border:none;background:none;cursor:pointer;">
      <span style="font-size:12px;color:var(--muted);">Notes Column Color</span>
    </div>`;
}

function buildDateRowElement(date) {
  const tr = document.createElement('tr');
  const wk = getWeekdayShort(date);
  tr.innerHTML = `
    <td class="date-cell">
      <button type="button" class="del-date" onclick="removeDateRow('${date}')" title="Remove date">×</button>
      <div><span>${formatDateDMY(date)}</span><span class="weekday-sub">${wk}</span></div>
    </td>
  `;

  state.columns.forEach(col => {
    const cell = getCell(date, col.id);
    const td = document.createElement('td');
    td.className = 'themed-cell';
    td.style.background = col.color;

    const subsHtml = cell.subs.map((sub, idx) => {
      const tClass = sub.status === 1 ? 'done' : sub.status === 2 ? 'cross' : sub.status === 3 ? 'orange' : '';
      return `
      <li class="sub-item">
        <span class="status-btn ${statusClass(sub.status)}" onclick="toggleSub('${date}','${col.id}',${idx})" title="Cycle: Done (✓) → Missed (✗) → Not Relevant (—)">${statusSymbol(sub.status)}</span>
        <div class="sub-text ${tClass}" contenteditable="true" onblur="editSubText('${date}','${col.id}',${idx},this.innerHTML)">${sub.text}</div>
        <span class="time-tag" contenteditable="true" onblur="editSubTime('${date}','${col.id}',${idx},this.innerText)">${sub.time || 'time'}</span>
        <span onclick="delSub('${date}','${col.id}',${idx})" style="cursor:pointer;color:var(--muted);font-size:13px;">×</span>
      </li>`;
    }).join('');

    td.innerHTML = `
      <div class="cell-top">
        <span class="status-btn ${statusClass(cell.status)}" onclick="toggleMain('${date}','${col.id}')" title="Click: ✓ Done | ✗ Missed | — Not Relevant">${statusSymbol(cell.status)}</span>
        <span style="font-size:12px;font-weight:600;">All tasks</span>
        <span class="time-tag" contenteditable="true" onblur="editMainTime('${date}','${col.id}',this.innerText)">${cell.time || '+ time'}</span>
      </div>
      <ul class="sub-list">${subsHtml}</ul>
      <button type="button" class="add-sub" onclick="addSub('${date}','${col.id}')">+ Add task / chapter</button>`;
    tr.appendChild(td);
  });

  const notesTd = document.createElement('td');
  notesTd.className = 'themed-cell';
  notesTd.style.background = state.notesColor;
  notesTd.innerHTML = `<div class="notes-box" contenteditable="true" onblur="editNote('${date}', this.innerHTML)">${state.notes[date] || ''}</div>`;
  tr.appendChild(notesTd);

  return tr;
}

function renderTableOnly() {
  document.getElementById('pageTitle').innerText = state.title;
  document.title = state.title;

  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('matrixBody');
  headerRow.innerHTML = '<th class="date-cell">Date</th>';

  state.columns.forEach(col => {
    const th = document.createElement('th');
    th.style.background = col.color;
    th.innerText = col.name;
    headerRow.appendChild(th);
  });

  const notesTh = document.createElement('th');
  notesTh.style.background = state.notesColor;
  notesTh.innerText = 'Notes';
  headerRow.appendChild(notesTh);

  tbody.innerHTML = '';
  const allRows = state.dates.map(date => {
    const tr = buildDateRowElement(date);
    tbody.appendChild(tr);
    return tr;
  });

  const tbodyTop = tbody.getBoundingClientRect().top;
  const bottomReserve = window.innerWidth <= 768 ? 72 : 56;
  const maxBodyHeight = Math.max(260, window.innerHeight - tbodyTop - bottomReserve);

  const slices = [];
  let startIdx = 0;
  let currentHeight = 0;

  allRows.forEach((tr, idx) => {
    const rowH = tr.offsetHeight || 110;
    if (idx > startIdx && (currentHeight + rowH) > maxBodyHeight) {
      slices.push([startIdx, idx]);
      startIdx = idx;
      currentHeight = rowH;
    } else {
      currentHeight += rowH;
    }
  });
  if (state.dates.length > 0) {
    slices.push([startIdx, state.dates.length]);
  }

  pageSlices = slices.length ? slices : [[0, 0]];
  if (matrixPage === null || matrixPage > pageSlices.length) {
    matrixPage = pageSlices.length;
  }
  if (matrixPage < 1) matrixPage = 1;

  const [visStart, visEnd] = pageSlices[matrixPage - 1];
  allRows.forEach((tr, idx) => {
    if (idx < visStart || idx >= visEnd) {
      tr.remove();
    }
  });

  updateFloatingPaginationVisibility();
}

function render() {
  applyTheme();
  renderSidebarControls();
  renderGoalsOverviewPage();
  renderGoalsOverview();
  renderTableOnly();
  renderDashboard();
  renderDeclutterList();
  renderTimelineSection();
  renderDiveSpacesGrid();

  if (currentView === 'diveSpaceDetail') renderDiveSpaceDetail();
}

  if ((state.notes[date] || '') === html) return;
  pushUndo();
  state.notes[date] = html;
  save();
}
function toggleMain(d, c) {
  pushUndo();
  const cell = getCell(d, c);
  cell.status = cycleStatus(cell.status);

  renderTableOnly();
}
function editMainTime(d, c, val) {

function addSub(d, c) {

  getCell(d, c).subs.push({ text: 'New task', time: '', status: 0 });

}
function toggleSub(d, c, i) {

  save();
  renderTableOnly();
}
function editSubText(d, c, i, html) {
  if (getCell(d, c).subs[i].text === html) return;
  pushUndo();
  getCell(d, c).subs[i].text = html;
  save();
  renderTableOnly();
}
function editSubTime(d, c, i, val) {
  const clean = val === 'time' ? '' : val.trim();
  if (getCell(d, c).subs[i].time === clean) return;
  pushUndo();
  getCell(d, c).subs[i].time = clean;
  save();
}
function delSub(d, c, i) {
  pushUndo();
  getCell(d, c).subs.splice(i, 1);
  save();
  renderTableOnly();
}

function calcDayScore(date) {
  let total = 0, done = 0;
  state.columns.forEach(col => {
    const cell = state.records[`${date}_${col.id}`];
    if (!cell) return;
    if (cell.subs && cell.subs.length > 0) {
      cell.subs.forEach(s => {
        if (s.status === 3) return;
        total++;
        if (s.status === 1) done++;
      });
    } else if (cell.status > 0 && cell.status !== 3) {
      total++;
      if (cell.status === 1) done++;
    }
  });
  return total === 0 ? null : Math.round((done / total) * 100);
}

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderDashboard();
}

function shiftWeek(deltaWeeks) {
  const next = new Date(weekAnchorMonday);
  next.setDate(next.getDate() + (deltaWeeks * 7));
  weekAnchorMonday = next;
  renderDashboard();
}

function renderDashboard() {
  const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const todayScore = calcDayScore(TODAY);
  const todayDisplay = todayScore !== null ? todayScore : 0;
  document.getElementById('todayChart').innerHTML = `
    <div class="bar-row">
      <span class="bar-label" style="width:76px;">${formatDateDMY(TODAY)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${todayDisplay}%"></div></div>
      <strong>${todayScore !== null ? todayScore + '%' : '0%'}</strong>
    </div>`;

  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const dt = new Date(weekAnchorMonday);
    dt.setDate(dt.getDate() + i);
    const iso = isoFromDateObj(dt);
    weekDays.push({
      label: MON_SUN_LABELS[i],
      fullDate: formatDateDMY(iso),
      score: calcDayScore(iso)
    });
  }
  const endSun = new Date(weekAnchorMonday);
  endSun.setDate(endSun.getDate() + 6);
  const validScores = weekDays.map(d => d.score).filter(s => s !== null);
  const weekAvg = validScores.length
    ? Math.round(validScores.reduce((a, b) => a + b, 0) / validScores.length)
    : 0;

  document.getElementById('weeklyRangeLabel').innerText =
    `${formatDateDMShort(isoFromDateObj(weekAnchorMonday))}–${formatDateDMShort(isoFromDateObj(endSun))} · ${weekAvg}%`;

  document.getElementById('weekChart').innerHTML = weekDays.map(d => {
    const pct = d.score !== null ? d.score : 0;
    const tip = `${d.label} (${d.fullDate})${d.score !== null ? ': ' + d.score + '%' : ': 0%'}`;
    return `
      <div class="bar-row" title="${tip}">
        <span class="bar-label">${d.label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <strong>${pct}%</strong>
      </div>`;
  }).join('');

  document.getElementById('monthLabel').innerText = `${monthNames[viewMonth]} ${viewYear}`;
  const dows = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let mHtml = dows.map(w => `<div class="m-dow">${w}</div>`).join('');

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const offset = (firstDay + 6) % 7;
  for (let i = 0; i < offset; i++) mHtml += `<div class="m-day empty"></div>`;

  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const sc = calcDayScore(dStr);
    let cls = '';
    if (sc !== null) {
      if (sc <= 20) cls = 'lvl-red';
      else if (sc <= 50) cls = 'lvl-orange';
      else if (sc <= 80) cls = 'lvl-green-light';
      else cls = 'lvl-green-dark';
    }
    mHtml += `<div class="m-day ${cls}" title="${formatDateDMY(dStr)}${sc !== null ? ': ' + sc + '%' : ''}">${day}</div>`;
  }
  document.getElementById('monthChart').innerHTML = mHtml;
}

window.reloadState = function () {
  state = normalizeState(JSON.parse(localStorage.getItem('iqraMatrixCleanV1')));
  render();
};
window.render = render;
render();

<script>
  const DB_URL = "https://iqra-s-day-tracker-default-rtdb.europe-west1.firebasedatabase.app/iqra_private_matrix_9921/matrixData.json";
  let lastSyncedValue = localStorage.getItem("iqraMatrixCleanV1") || "";

  window.pushToCloud = function () {
    const val = localStorage.getItem("iqraMatrixCleanV1");
    if (!val) return;
    lastSyncedValue = val;
    fetch(DB_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(val)
    }).catch(err => console.error("Cloud save failed:", err));
  };

  async function pullFromCloud() {
    try {
      const res = await fetch(DB_URL + "?t=" + Date.now());
      const cloudVal = await res.json();
      if (!cloudVal || typeof cloudVal !== "string") return;

      if (cloudVal !== lastSyncedValue && localStorage.getItem("iqraMatrixCleanV1") !== cloudVal) {
        lastSyncedValue = cloudVal;
        localStorage.setItem("iqraMatrixCleanV1", cloudVal);
        if (window.reloadState) window.reloadState();
      }
    } catch (err) {
      console.error("Cloud fetch failed:", err);
    }
  }

  pullFromCloud();
  setInterval(pullFromCloud, 2000);
</script>
