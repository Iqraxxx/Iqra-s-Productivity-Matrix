<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Iqra's Productivity Matrix</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="metaThemeColor" content="#ffffff">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f8fafc;
    --surface: #ffffff;
    --subtle: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0f172a;
    --accent-text: #ffffff;
    --date-bg: #ffffff;
    --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }

  /* Sticky Note Light Yellow Theme */
  body[data-theme="yellow"] {
    --bg: #fef9c3;
    --sidebar: #fef08a;
    --surface: #fefce8;
    --subtle: #fde04766;
    --border: #ca8a0455;
    --text: #422006;
    --muted: #854d0e;
    --accent: #a16207;
    --accent-text: #ffffff;
    --date-bg: #fefce8;
    --card-shadow: 0 1px 3px rgba(66, 32, 6, 0.05);
  }

  /* Rich Obsidian-Slate Dark Mode Theme */
  body[data-theme="dark"] {
    --bg: #090d16;
    --sidebar: #0e1422;
    --surface: #131c2e;
    --subtle: #19243a;
    --border: #26334d;
    --text: #e2e8f0;
    --muted: #8b9bb4;
    --accent: #60a5fa;
    --accent-text: #071120;
    --date-bg: #0f1729;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.32);
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    background: var(--bg);
    color: var(--text);
    overflow-x: clip;
    margin: 0;
    padding: 0;
    transition: background 0.2s ease, color 0.2s ease;
  }

  body::before {
    content: "";
    position: fixed;
    top: -60px;
    left: 0;
    right: 0;
    height: calc(60px + env(safe-area-inset-top, 0px));
    background: var(--bg);
    z-index: 9999;
    pointer-events: none;
    transition: background 0.2s ease;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    overflow-x: clip;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* Invisible left-edge swipe trigger on mobile */
  .edge-swipe-zone { display: none; }
  @media (max-width: 768px) {
    .edge-swipe-zone {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 22px;
      z-index: 90;
    }
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.6);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 95;
  }
  .sidebar-backdrop.active { display: block; }

  /* Scrollable & Rollable Left Sidebar */
  .sidebar {
    width: 310px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 48px;
    transition: margin-left 0.25s ease, transform 0.25s ease, background 0.2s ease;
    flex-shrink: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  .sidebar.closed { margin-left: -310px; }

  .sidebar-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-top-row span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .side-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    box-shadow: var(--card-shadow);
  }

  .side-box h4 {
    margin: 0 0 8px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  .side-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 15px;
    margin-bottom: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .side-input:focus {
    border-color: var(--accent);
  }

  /* Custom D/M/YYYY Log Date Field with Integrated Calendar Picker */
  .dmy-date-field {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 8px;
  }
  .dmy-date-field input[type="text"] {
    width: 100%;
    padding: 8px 36px 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .dmy-date-field input[type="text"]:focus {
    border-color: var(--accent);
  }
  .dmy-picker-trigger {
    position: absolute;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    overflow: hidden;
  }
  .dmy-picker-trigger:hover {
    background: var(--subtle);
    color: var(--text);
  }
  .dmy-picker-trigger input[type="date"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  body:not([data-theme="dark"]) .btn:hover:not(:disabled) { filter: brightness(0.96); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  /* Collapsible Single-Heading Accordion Sections */
  .acc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: var(--card-shadow);
  }
  .acc-btn {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    text-align: left;
  }
  .acc-btn:hover { background: var(--subtle); }
  .acc-arrow { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
  .acc-card.open .acc-arrow { transform: rotate(180deg); }
  .acc-panel {
    display: none;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
  }
  .acc-card.open .acc-panel { display: block; }

  /* Original Dashboard Bars & Goal Progress Bars */
  .bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11px; }
  .bar-label { width: 74px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 10px; background: var(--subtle); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: #22c55e; transition: width 0.3s; }
  body[data-theme="dark"] .bar-fill { background: #34d399; }

  /* Long Term Goals Sidebar List */
  .goal-side-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 6px;
    background: var(--subtle);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 7px;
  }
  .goal-name-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    outline: none;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .goal-name-input:focus {
    background: var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .goal-open-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .goal-open-pill:hover { filter: brightness(1.08); }

  /* 4-Tier Monthly Overview */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .month-nav button {
    background: var(--subtle);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
  .m-dow { font-size: 9px; font-weight: 700; text-align: center; color: var(--muted); }
  .m-day {
    aspect-ratio: 1;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    background: var(--subtle);
    color: var(--text);
  }
  .m-day.empty { background: transparent; }
  .m-day.lvl-red { background: #ef4444; color: #ffffff; }
  .m-day.lvl-orange { background: #f97316; color: #ffffff; }
  .m-day.lvl-green-light { background: #4ade80; color: #052e16; }
  .m-day.lvl-green-dark { background: #15803d; color: #ffffff; }

  .m-legend {
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 8px;
  }
  .m-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 2px;
    vertical-align: middle;
  }

  /* Theme Selector inside Customize Matrix */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 12px;
  }
  .theme-opt {
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    text-align: center;
  }
  .theme-opt.active {
    outline: 2px solid var(--accent);
    border-color: var(--accent);
  }
  .col-manage-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

  /* Main Area */
  .main {
    flex: 1;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 28px 76px;
    overflow-x: auto;
    min-width: 0;
    background: var(--bg);
    transition: background 0.2s ease;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toggle-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .toggle-btn:hover:not(:disabled) { background: var(--subtle); }
  .toggle-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .format-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .format-tools button {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .format-tools button:hover { background: var(--subtle); }

  /* Locked Non-Editable Main Title (Editable only inside Customize Matrix menu) */
  .page-title {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 18px 0;
    padding: 2px 4px;
    user-select: none;
    letter-spacing: -0.02em;
  }

  /* Clean Matrix Table */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    background: var(--surface);
    box-shadow: var(--card-shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border: 1px solid var(--border);
    padding: 10px 12px;
    vertical-align: top;
    min-width: 210px;
    position: relative;
  }
  th { font-size: 13px; font-weight: 700; text-align: left; }

  /* Theme-adapted cell overlay for Dark & Yellow themes */
  body[data-theme="dark"] th {
    background-color: #162033 !important;
    color: #f1f5f9 !important;
  }
  body[data-theme="dark"] td.themed-cell {
    background-color: var(--surface) !important;
    color: var(--text) !important;
  }
  body[data-theme="yellow"] th,
  body[data-theme="yellow"] td.themed-cell {
    background-color: var(--surface) !important;
    color: var(--text) !important;
  }

  .date-cell {
    min-width: 145px;
    width: 145px;
    font-weight: 700;
    font-size: 13px;
    background: var(--date-bg) !important;
    color: var(--text) !important;
    white-space: nowrap;
  }
  .weekday-sub {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-left: 5px;
  }
  .del-date {
    float: right;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    border: none;
    background: none;
    padding: 0 4px;
  }
  .del-date:hover { color: #f87171; }

  .cell-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .status-btn {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    background: var(--bg);
    color: var(--text);
    flex-shrink: 0;
    user-select: none;
  }
  .status-done { background: #22c55e; color: #fff; border-color: #16a34a; }
  .status-cross { background: #ef4444; color: #fff; border-color: #dc2626; }
  .status-orange { background: #f97316; color: #fff; border-color: #ea580c; }

  .time-tag {
    font-size: 11px;
    color: var(--muted);
    background: var(--subtle);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    outline: none;
    min-width: 42px;
    margin-left: auto;
  }

  .sub-list { list-style: none; padding: 0; margin: 0 0 6px 0; display: flex; flex-direction: column; gap: 6px; }
  .sub-item { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; }
  .sub-text { flex: 1; outline: none; line-height: 1.4; word-break: break-word; }
  .sub-text.done { text-decoration: line-through; opacity: 0.6; }
  .sub-text.cross { color: #f87171; text-decoration: line-through; }
  .sub-text.orange { color: #fb923c; text-decoration: line-through; opacity: 0.82; }

  .add-sub {
    font-size: 11.5px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    font-weight: 600;
  }
  .add-sub:hover { color: var(--text); text-decoration: underline; }

  .notes-box { min-height: 60px; font-size: 13px; line-height: 1.5; outline: none; }
  .notes-box:empty:before { content: "Write notes..."; color: var(--muted); }

  /* Floating Bottom Pill for Page Navigation (Matrix) */
  .floating-page-pill {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .pill-nav-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    font-size: 14px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .pill-nav-btn:hover:not(:disabled) {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .pill-nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .pill-page-label {
    font-size: 12px;
    font-weight: 700;
    padding: 0 4px;
    white-space: nowrap;
  }

  /* Inline Subpage Pager Bar */
  .subpage-pager {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .subpage-pager button {
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .subpage-pager button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Dedicated Sub-Pages */
  .subpage-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    max-width: 920px;
    box-shadow: var(--card-shadow);
  }
  .subpage-card.active { display: block; }
  .subpage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .subpage-header h2 { margin: 0; font-size: 20px; font-weight: 800; }

  .declutter-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .declutter-input-row input[type="date"] {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  /* Simple User-Friendly Time Input (e.g. 10:00 - 11:30) */
  .tl-time-text-input {
    width: 158px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .tl-time-text-input:focus {
    border-color: var(--accent);
  }
  .tl-time-text-input::placeholder {
    color: var(--muted);
  }

  /* Rich Contenteditable Input Box for Highlight / Underline / Emoji support */
  .rich-input-box {
    flex: 1;
    min-width: 180px;
    min-height: 42px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.4;
    outline: none;
    word-break: break-word;
  }
  .rich-input-box:focus {
    border-color: var(--accent);
  }
  .rich-input-box:empty:before {
    content: attr(data-placeholder);
    color: var(--muted);
    pointer-events: none;
  }

  .declutter-bullets {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .declutter-bullet-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--subtle);
    border: 1px solid var(--border);
    font-size: 15px;
    line-height: 1.45;
  }
  .dym-line-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .dym-line-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .declutter-bullet-item.struck .dym-line-btn {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .declutter-bullet-text {
    flex: 1;
    outline: none;
    word-break: break-word;
  }
  .declutter-bullet-text::before {
    content: "• ";
    font-weight: 800;
    margin-right: 4px;
  }
  .declutter-bullet-item.struck .declutter-bullet-text {
    text-decoration: line-through;
    opacity: 0.52;
  }

  /* Compact Expandable "Your Calendar" Chip & Drawer inside Timeline */
  .your-cal-bar {
    margin-bottom: 14px;
  }
  .your-cal-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--subtle);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .your-cal-chip.open {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .timeline-cal-drawer {
    display: none;
    background: var(--subtle);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    max-width: 390px;
  }
  .timeline-cal-drawer.open {
    display: block;
  }
  .tl-cal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .tl-cal-title {
    font-size: 13px;
    font-weight: 800;
  }
  .tl-cal-nav {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tl-cal-nav button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .tl-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .tl-cal-dow {
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
  }
  .tl-cal-day {
    height: 32px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }
  .tl-cal-day.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
  }
  .tl-cal-day.has-event {
    color: #0f172a;
    border-color: rgba(15, 23, 42, 0.2);
  }
  .tl-cal-day.selected-day {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .tl-event-names-footer {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tl-event-only-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #0f172a;
    border: 1px solid rgba(15, 23, 42, 0.14);
  }
  .tl-time-badge {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.78;
  }

  .timeline-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .timeline-table th, .timeline-table td {
    min-width: 0;
    border: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 14px;
    vertical-align: middle;
  }
  .timeline-table th {
    background: var(--subtle);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
  }
  .tl-crossed {
    text-decoration: line-through;
    color: #f87171;
    opacity: 0.75;
  }
  .tl-done {
    text-decoration: line-through;
    opacity: 0.6;
  }

  /* Goal Action Plan Cards */
  .action-tasks-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .action-tasks-bar span {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .goal-task-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .goal-task-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .goal-task-label {
    font-size: 13px;
    font-weight: 800;
  }
  .goal-task-label.is-done { text-decoration: line-through; opacity: 0.6; }
  .goal-task-label.is-irrelevant { text-decoration: line-through; color: #fb923c; opacity: 0.82; }
  .goal-task-detail {
    width: 100%;
    min-height: 48px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    outline: none;
    margin-bottom: 8px;
    word-break: break-word;
  }
  .goal-task-detail:empty:before {
    content: "Type task details...";
    color: var(--muted);
    pointer-events: none;
  }
  .goal-task-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .goal-task-footer input[type="date"] {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 13px;
  }

  /* Dive Into Blocks Grid & Detail View */
  .dive-spaces-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 14px;
    margin-top: 8px;
  }
  .dive-folder-card {
    border-radius: 12px;
    padding: 16px;
    min-height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid rgba(15, 23, 42, 0.14);
    color: #0f172a;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }
  body[data-theme="dark"] .dive-folder-card {
    color: #0f172a;
    border: 1.5px solid rgba(147, 197, 253, 0.55);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  body[data-theme="dark"] .dive-folder-card:hover {
    border-color: #93c5fd;
    box-shadow: 0 8px 20px rgba(96, 165, 250, 0.22);
  }
  body[data-theme="yellow"] .dive-folder-card {
    color: #422006;
    border-color: rgba(66, 32, 6, 0.18);
  }
  .dive-folder-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
  }
  .dive-del-corner {
    position: absolute;
    top: 6px;
    right: 8px;
    border: none;
    background: none;
    color: inherit;
    opacity: 0.6;
    font-size: 15px;
    cursor: pointer;
    padding: 2px 5px;
  }
  .dive-del-corner:hover { opacity: 1; color: #dc2626; }
  .dive-folder-name {
    font-size: 16px;
    font-weight: 800;
    word-break: break-word;
  }

  .dive-split-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .dive-panel {
    background: var(--subtle);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .dive-panel h3 {
    margin: 0 0 10px 0;
    font-size: 15px;
    font-weight: 800;
  }
  .dive-item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .dive-item-text {
    flex: 1;
    outline: none;
    line-height: 1.4;
    word-break: break-word;
  }
  .dive-done-badge {
    font-size: 12px;
    font-weight: 800;
    color: #22c55e;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    body { overflow-x: clip; }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      height: 100dvh;
      width: 85vw;
      max-width: 310px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      box-shadow: 4px 0 24px rgba(0,0,0,0.35);
      transition: transform 0.25s ease;
    }
    .sidebar.closed { margin-left: 0; transform: translateX(-100%); }
    .main {
      padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 76px;
      width: 100%;
    }
    .page-title { font-size: 20px; margin-bottom: 12px; }
    th, td { min-width: 180px; padding: 8px; }
    .date-cell { min-width: 128px; width: 128px; font-size: 12px; position: sticky; left: 0; z-index: 3; }
    .status-btn { width: 24px; height: 24px; }
    .subpage-card { padding: 16px 14px; }
    .dive-split-grid { grid-template-columns: 1fr; }
    .timeline-cal-drawer { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="edge-swipe-zone" id="edgeSwipeZone"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<!-- Collapsible & Scrollable Left Sidebar -->
<aside class="sidebar closed" id="sidebar">
  <div class="sidebar-top-row">
    <span>Menu</span>
    <button class="toggle-btn" onclick="closeSidebar()" style="padding: 4px 10px; font-size: 12px;">✕ Close Menu</button>
  </div>

  <!-- 1. Log Date (Direct D/M/YYYY Format + Calendar Picker) -->
  <div class="side-box">
    <h4>📅 Log Date</h4>
    <div class="dmy-date-field">
      <input type="text" id="dateDmyInput" inputmode="numeric" placeholder="D/M/YYYY" oninput="onDmyTextInput(this.value)" onblur="normalizeDmyInputBlur()">
      <span class="dmy-picker-trigger" title="Pick date">
        📅
        <input type="date" id="dateInput" onchange="onNativeDatePicked(this.value)">
      </span>
    </div>
    <button class="btn btn-primary" onclick="addDateRow()">+ Add Date to Table</button>
  </div>

  <!-- 2. Productivity Dashboard -->
  <div class="acc-card" id="acc-dashboard">
    <button class="acc-btn" onclick="toggleAccordion('acc-dashboard')">
      <span>📊 Productivity Dashboard</span>
      <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
      <div style="font-size:12px; font-weight:600; margin-bottom:4px;">Today's Progress</div>
      <div id="todayChart" style="margin-bottom:12px;"></div>

      <div style="font-size:12px; font-weight:600; margin-bottom:4px;">Weekly Pattern (Avg %)</div>
      <div id="weekChart"></div>
    </div>
  </div>

  <!-- 3. Monthly Overview -->
  <div class="acc-card" id="acc-monthly">
    <button class="acc-btn" onclick="toggleAccordion('acc-monthly')">
      <span>🗓️ Monthly Overview</span>
      <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
      <div class="month-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <span id="monthLabel">Month Year</span>
        <button onclick="shiftMonth(1)">›</button>
      </div>
      <div class="month-grid" id="monthChart"></div>
      <div class="m-legend">
        <span><i class="m-dot" style="background:#ef4444;"></i>0%</span>
        <span><i class="m-dot" style="background:#f97316;"></i>&lt;50%</span>
        <span><i class="m-dot" style="background:#4ade80;"></i>50-99%</span>
        <span><i class="m-dot" style="background:#15803d;"></i>100%</span>
      </div>
    </div>
  </div>

  <!-- 4. Declutter Your Mind -->
  <div class="acc-card">
    <button class="acc-btn" onclick="openSubpage('declutter')">
      <span>🧠 Declutter Your Mind</span>
      <span style="font-size:11px; color:var(--muted);">Open →</span>
    </button>
  </div>

  <!-- 5. Your Upcoming Timeline -->
  <div class="acc-card">
    <button class="acc-btn" onclick="openSubpage('timeline')">
      <span>⏳ Your Upcoming Timeline</span>
      <span style="font-size:11px; color:var(--muted);">Open →</span>
    </button>
  </div>

  <!-- 6. Dive Into -->
  <div class="acc-card">
    <button class="acc-btn" onclick="openSubpage('diveInto')">
      <span>🗂️ Dive Into</span>
      <span style="font-size:11px; color:var(--muted);">Open →</span>
    </button>
  </div>

  <!-- 7. Your Long Term Goals -->
  <div class="acc-card" id="acc-goals">
    <button class="acc-btn" onclick="toggleAccordion('acc-goals')">
      <span>🎯 Your Long Term Goals</span>
      <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
      <div id="goalsSideList"></div>
      <button class="btn" onclick="addGoal()" style="margin-top:4px;">+ Add Goal</button>
    </div>
  </div>

  <!-- 8. Your Goals Overview (Right under Long Term Goals) -->
  <div class="acc-card" id="acc-goals-overview">
    <button class="acc-btn" onclick="toggleAccordion('acc-goals-overview')">
      <span>📈 Your Goals Overview</span>
      <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
      <div id="goalsOverviewBars"></div>
    </div>
  </div>

  <!-- 9. Customize Matrix -->
  <div class="acc-card" id="acc-customize">
    <button class="acc-btn" onclick="toggleAccordion('acc-customize')">
      <span>⚙️ Customize Matrix</span>
      <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
      <label style="font-size:11px; color:var(--muted); display:block; margin-bottom:4px;">Theme</label>
      <div class="theme-grid">
        <button class="theme-opt" id="theme-white" onclick="setTheme('white')">☀️ White</button>
        <button class="theme-opt" id="theme-yellow" onclick="setTheme('yellow')">📝 Yellow</button>
        <button class="theme-opt" id="theme-dark" onclick="setTheme('dark')">🌙 Dark</button>
      </div>

      <label style="font-size:11px; color:var(--muted); display:block; margin-bottom:4px;">App / Table Title</label>
      <input type="text" id="titleInput" class="side-input" oninput="updateTitle(this.value)">

      <label style="font-size:11px; color:var(--muted); display:block; margin-bottom:4px;">Columns & Colors</label>
      <div id="colManager"></div>
      <button class="btn" onclick="addColumn()" style="margin-top:6px;">+ Add Column</button>
    </div>
  </div>
</aside>

<!-- Main Workspace -->
<main class="main" id="mainWorkspace">
  <div class="top-bar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰ Menu & Dashboard</button>
    <div class="format-tools">
      <button onmousedown="event.preventDefault()" onclick="formatText('hiliteColor', '#fef08a')" title="Highlight selected text">🖍️ Highlight</button>
      <button onmousedown="event.preventDefault()" onclick="formatText('underline')" title="Underline selected text"><u>U</u> Underline</button>
      <button onmousedown="event.preventDefault()" onclick="insertSticker('❗')" title="Insert exclamation mark">❗</button>
      <button id="undoBtn" onclick="undoLastAction()" disabled title="Undo last change (Cmd+Z)">↩ Undo</button>
    </div>
  </div>

  <!-- Locked Title (Editable only inside Customize Matrix menu) -->
  <h1 id="pageTitle" class="page-title"></h1>

  <!-- View 1: Matrix Table View -->
  <div class="table-wrap" id="matrixView">
    <table>
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="matrixBody"></tbody>
    </table>
  </div>

  <!-- Floating Bottom Pill for Multi-Page Navigation -->
  <div class="floating-page-pill" id="matrixPagination">
    <button class="pill-nav-btn" id="prevPageBtn" onclick="changeMatrixPage(-1)" title="Previous Page">‹</button>
    <span class="pill-page-label" id="pageIndicator">1 / 1</span>
    <button class="pill-nav-btn" id="nextPageBtn" onclick="changeMatrixPage(1)" title="Next Page">›</button>
  </div>

  <!-- View 2: Declutter Your Mind Page -->
  <section class="subpage-card" id="declutterView">
    <div class="subpage-header">
      <h2>🧠 Declutter Your Mind</h2>
      <button class="toggle-btn" onclick="openSubpage('matrix')">← Back to Matrix</button>
    </div>
    <div class="declutter-input-row">
      <div id="declutterInput" class="rich-input-box" contenteditable="true" data-placeholder="Jot an extra thought..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addDeclutterBullet(); }"></div>
      <button class="btn btn-primary" style="width:auto; padding:0 16px;" onclick="addDeclutterBullet()">+ Add</button>
    </div>
    <ul class="declutter-bullets" id="declutterList"></ul>
    <div class="subpage-pager" id="dymPager"></div>
  </section>

  <!-- View 3: Your Upcoming Timeline Page -->
  <section class="subpage-card" id="timelineView">
    <div class="subpage-header">
      <h2>⏳ Your Upcoming Timeline</h2>
      <button class="toggle-btn" onclick="openSubpage('matrix')">← Back to Matrix</button>
    </div>

    <div class="declutter-input-row">
      <input type="date" id="tlDateInput">
      <input type="text" id="tlTimeTextInput" class="tl-time-text-input" placeholder="Time (e.g. 10:00 - 11:30)" onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTimelineItem(); }">
      <div id="tlActivityInput" class="rich-input-box" contenteditable="true" data-placeholder="Activity or event to attend..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTimelineItem(); }"></div>
      <button class="btn btn-primary" style="width:auto; padding:0 16px;" onclick="addTimelineItem()">+ Add</button>
    </div>

    <!-- Compact Expandable "Your Calendar" -->
    <div class="your-cal-bar">
      <button type="button" class="your-cal-chip" id="yourCalendarChip" onclick="toggleYourCalendar()">
        <span>🗓️</span>
        <span>Your Calendar</span>
      </button>

      <div class="timeline-cal-drawer" id="timelineCalDrawer">
        <div class="tl-cal-top">
          <div class="tl-cal-title" id="tlCalMonthLabel"></div>
          <div class="tl-cal-nav">
            <button type="button" onclick="shiftTimelineCal(-1)">‹</button>
            <button type="button" onclick="shiftTimelineCal(1)">›</button>
          </div>
        </div>
        <div class="tl-cal-grid" id="tlCalendarGrid"></div>
        <div class="tl-event-names-footer" id="tlSelectedEventsBox" style="display:none;"></div>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table class="timeline-table">
        <thead>
          <tr>
            <th style="width:44px; text-align:center;">Status</th>
            <th style="width:140px;">Date</th>
            <th style="width:130px;">Time</th>
            <th>Activity</th>
            <th style="width:44px;"></th>
          </tr>
        </thead>
        <tbody id="timelineBody"></tbody>
      </table>
    </div>
    <div class="subpage-pager" id="timelinePager"></div>
  </section>

  <!-- View 4: Goal Action Plan Page -->
  <section class="subpage-card" id="goalPlanView">
    <div class="subpage-header">
      <h2>🎯 Action Plan — <span id="activeGoalTitle">Goal</span></h2>
      <button class="toggle-btn" onclick="openSubpage('matrix')">← Back to Matrix</button>
    </div>
    <div class="action-tasks-bar">
      <span>Tasks</span>
      <button class="btn btn-primary" style="width:auto; padding:6px 14px;" onclick="addGoalTask()">+ Add Tasks</button>
    </div>
    <div id="goalTasksContainer"></div>
  </section>

  <!-- View 5: Dive Into Blocks Overview Page -->
  <section class="subpage-card" id="diveIntoView">
    <div class="subpage-header">
      <h2>🗂️ Dive Into</h2>
      <button class="toggle-btn" onclick="openSubpage('matrix')">← Back to Matrix</button>
    </div>
    <div class="declutter-input-row">
      <input type="text" id="diveSpaceNameInput" class="rich-input-box" style="flex:1; min-width:180px;" placeholder="Study, Work, Hobbies.." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addDiveSpace(); }">
      <button class="btn btn-primary" style="width:auto; padding:0 16px;" onclick="addDiveSpace()">Add Block</button>
    </div>
    <div class="dive-spaces-grid" id="diveSpacesGrid"></div>
    <div class="subpage-pager" id="diveSpacesPager"></div>
  </section>

  <!-- View 6: Individual Dive Into Block Detail Page -->
  <section class="subpage-card" id="diveSpaceDetailView">
    <div class="subpage-header">
      <h2 id="diveSpaceDetailTitle">Block</h2>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="toggle-btn" onclick="openSubpage('diveInto')">← Dive Into</button>
        <button class="toggle-btn" onclick="openSubpage('matrix')">Matrix</button>
      </div>
    </div>

    <div class="dive-split-grid">
      <!-- Left: To Be Completed -->
      <div class="dive-panel">
        <h3>To Be Completed</h3>
        <div class="declutter-input-row" style="margin-bottom:12px;">
          <div id="diveTbcInput" class="rich-input-box" contenteditable="true" data-placeholder="Add task..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addDiveTbcItem(); }"></div>
          <button class="btn btn-primary" style="width:auto; padding:0 14px;" onclick="addDiveTbcItem()">+ Add</button>
        </div>
        <div id="diveTbcList"></div>
        <div class="subpage-pager" id="diveTbcPager"></div>
      </div>

      <!-- Right: Already Done -->
      <div class="dive-panel">
        <h3>Already Done</h3>
        <div class="declutter-input-row" style="margin-bottom:12px;">
          <div id="diveCompletedInput" class="rich-input-box" contenteditable="true" data-placeholder="Finished something? Add it" onkeydown="if(event.key==='Enter'){ event.preventDefault(); addDiveCompletedDirect(); }"></div>
          <button class="btn btn-primary" style="width:auto; padding:0 14px;" onclick="addDiveCompletedDirect()">+ Add</button>
        </div>
        <div id="diveCompletedList"></div>
        <div class="subpage-pager" id="diveDonePager"></div>
      </div>
    </div>
  </section>
</main>

<script>
function getLocalTodayISO() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

const TODAY = getLocalTodayISO();
const WEEKDAYS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const DIVE_PALETTE = [
  '#dbeafe',
  '#dcfce7',
  '#fae8ff',
  '#ffedd5',
  '#e0f2fe',
  '#fce7f3'
];

/* Light, clean shades of blue compatible with Dark Theme */
const DIVE_DARK_PALETTE = [
  '#dbeafe',
  '#cfe3ff',
  '#e0f2fe',
  '#d4e6ff',
  '#cbe0fd',
  '#e2edff'
];

const TIMELINE_EVENT_COLORS = [
  '#bae6fd',
  '#bbf7d0',
  '#fed7aa',
  '#ddd6fe',
  '#fbcfe8',
  '#fde68a'
];

const SUBPAGE_SIZE = 8;
const DIVE_BLOCK_PAGE_SIZE = 8;

let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let tlCalYear = new Date().getFullYear();
let tlCalMonth = new Date().getMonth();
let yourCalendarOpen = false;
let selectedTimelineDate = null;
let selectedLogDateISO = TODAY;

let dymPage = 1;
let timelinePage = 1;
let diveSpacesPage = 1;
let diveTbcPage = 1;
let diveDonePage = 1;

let currentView = 'matrix';
let activeGoalId = null;
let activeDiveSpaceId = null;
let matrixPage = 1;
let pageSlices = [];

const DEFAULT_DATA = {
  title: "Iqra's Productivity Matrix",
  theme: "white",
  dates: [TODAY],
  notesColor: "#fffbeb",
  columns: [
    { id: 'c1', name: 'Study', color: '#eff6ff' },
    { id: 'c2', name: 'Work / Projects', color: '#f0fdf4' },
    { id: 'c3', name: 'Personal & Health', color: '#fdf4ff' }
  ],
  records: {},
  notes: {},
  braindump: [],
  timeline: [],
  goals: [],
  diveSpaces: []
};

function normalizeState(rawObj) {
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if (!rawObj || typeof rawObj !== 'object') return base;

  const merged = { ...base, ...rawObj };
  if (!merged.theme) merged.theme = "white";
  if (!Array.isArray(merged.braindump)) merged.braindump = [];
  if (!Array.isArray(merged.timeline)) merged.timeline = [];
  if (!Array.isArray(merged.goals)) merged.goals = [];
  if (!Array.isArray(merged.diveSpaces)) merged.diveSpaces = [];

  merged.timeline = merged.timeline.map((ev, idx) => ({
    id: ev.id || ('tl' + idx + '_' + Date.now()),
    date: ev.date || TODAY,
    time: typeof ev.time === 'string' ? ev.time : '',
    endTime: typeof ev.endTime === 'string' ? ev.endTime : '',
    activity: ev.activity || '',
    status: Number(ev.status) || 0
  }));

  merged.diveSpaces = merged.diveSpaces.map((sp, idx) => ({
    id: sp.id || ('ds' + idx + '_' + Date.now()),
    name: sp.name || ('Block ' + (idx + 1)),
    color: sp.color || DIVE_PALETTE[idx % DIVE_PALETTE.length],
    tbc: Array.isArray(sp.tbc) ? sp.tbc : [],
    completed: Array.isArray(sp.completed) ? sp.completed : []
  }));

  const validDates = Array.isArray(merged.dates)
    ? merged.dates
        .map(d => String(d).split('_')[0])
        .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d))
    : [TODAY];

  merged.dates = Array.from(new Set(validDates.length ? validDates : [TODAY])).sort();
  return merged;
}

let state = normalizeState(JSON.parse(localStorage.getItem('iqraMatrixCleanV1')));
let undoStack = [];

function formatDateDMY(isoStr) {
  const clean = String(isoStr || '').split('_')[0];
  const parts = clean.split('-');
  if (parts.length !== 3) return clean;
  return `${Number(parts[2])}/${Number(parts[1])}/${parts[0]}`;
}

function parseDmyToISO(dmyStr) {
  const cleaned = String(dmyStr || '').trim().replace(/[.\-]/g, '/');
  const m = cleaned.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const day = Number(m[1]);
  const month = Number(m[2]);
  const year = Number(m[3]);
  if (month < 1 || month > 12 || day < 1 || day > 31) return null;
  const dt = new Date(year, month - 1, day);
  if (dt.getFullYear() !== year || dt.getMonth() !== month - 1 || dt.getDate() !== day) return null;
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function setLogDateControls(isoDate) {
  selectedLogDateISO = isoDate || TODAY;
  const nativeEl = document.getElementById('dateInput');
  const textEl = document.getElementById('dateDmyInput');
  if (nativeEl) nativeEl.value = selectedLogDateISO;
  if (textEl) textEl.value = formatDateDMY(selectedLogDateISO);
}

function onNativeDatePicked(isoVal) {
  if (!isoVal) return;
  setLogDateControls(isoVal);
}

function onDmyTextInput(val) {
  const parsed = parseDmyToISO(val);
  if (parsed) {
    selectedLogDateISO = parsed;
    const nativeEl = document.getElementById('dateInput');
    if (nativeEl) nativeEl.value = parsed;
  }
}

function normalizeDmyInputBlur() {
  const textEl = document.getElementById('dateDmyInput');
  if (!textEl) return;
  const parsed = parseDmyToISO(textEl.value);
  if (parsed) {
    setLogDateControls(parsed);
  } else {
    setLogDateControls(selectedLogDateISO || TODAY);
  }
}

setLogDateControls(TODAY);
document.getElementById('tlDateInput').value = TODAY;

function getWeekdayShort(isoStr) {
  const clean = String(isoStr || '').split('_')[0];
  const parts = clean.split('-').map(Number);
  if (parts.length !== 3) return '';
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  if (Number.isNaN(dt.getTime())) return '';
  return WEEKDAYS_SHORT[dt.getDay()];
}

function formatEventTimeDisplay(ev) {
  const start = (ev.time || '').trim();
  const end = (ev.endTime || '').trim();
  if (start && end) return `${start} – ${end}`;
  if (start) return start;
  if (end) return end;
  return '';
}

function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 40) undoStack.shift();
  updateUndoBtn();
}

function updateUndoBtn() {
  const btn = document.getElementById('undoBtn');
  if (btn) btn.disabled = undoStack.length === 0;
}

function undoLastAction() {
  if (undoStack.length === 0) return;
  state = normalizeState(JSON.parse(undoStack.pop()));
  updateUndoBtn();
  save();
  render();
}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    const tag = document.activeElement ? document.activeElement.tagName : '';
    const isEdit = document.activeElement && document.activeElement.isContentEditable;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isEdit) {
      e.preventDefault();
      undoLastAction();
    }
  }
});

function save() {
  applyTheme();
  localStorage.setItem('iqraMatrixCleanV1', JSON.stringify(state));
  if (window.pushToCloud) window.pushToCloud();
  renderDashboard();
  renderGoalsOverview();
}

function applyTheme() {
  const t = state.theme || 'white';
  document.body.setAttribute('data-theme', t);
  const metaColor = document.getElementById('metaThemeColor');
  if (metaColor) {
    metaColor.setAttribute('content', t === 'dark' ? '#090d16' : t === 'yellow' ? '#fef9c3' : '#ffffff');
  }
  ['white', 'yellow', 'dark'].forEach(name => {
    const btn = document.getElementById('theme-' + name);
    if (btn) btn.classList.toggle('active', name === t);
  });
}

function setTheme(t) {
  pushUndo();
  state.theme = t;
  save();
  renderTableOnly();
  if (currentView === 'diveInto') renderDiveSpacesGrid();
}

/* Sidebar Open / Close & Mobile Swipe Gestures */
function openSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  sb.classList.remove('closed');
  sb.style.transform = '';
  if (window.innerWidth <= 768) bd.classList.add('active');
}

function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  sb.classList.add('closed');
  sb.style.transform = '';
  bd.classList.remove('active');
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('closed')) openSidebar();
  else closeSidebar();
}

(function setupSwipe() {
  const sb = document.getElementById('sidebar');
  const edge = document.getElementById('edgeSwipeZone');
  let startX = 0, startY = 0, curX = 0, swipingClose = false, swipingOpen = false;

  sb.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 768 || sb.classList.contains('closed')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    curX = startX;
    swipingClose = true;
    sb.style.transition = 'none';
  }, { passive: true });

  sb.addEventListener('touchmove', (e) => {
    if (!swipingClose) return;
    curX = e.touches[0].clientX;
    const dx = curX - startX;
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dx < 0 && Math.abs(dx) > dy * 0.9) {
      sb.style.transform = `translateX(${dx}px)`;
    }
  }, { passive: true });

  sb.addEventListener('touchend', () => {
    if (!swipingClose) return;
    swipingClose = false;
    sb.style.transition = '';
    if (curX - startX < -55) closeSidebar();
    else sb.style.transform = '';
  });

  edge.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 768 || !sb.classList.contains('closed')) return;
    startX = e.touches[0].clientX;
    curX = startX;
    swipingOpen = true;
  }, { passive: true });

  edge.addEventListener('touchmove', (e) => {
    if (!swipingOpen) return;
    curX = e.touches[0].clientX;
  }, { passive: true });

  edge.addEventListener('touchend', () => {
    if (!swipingOpen) return;
    swipingOpen = false;
    if (curX - startX > 45) openSidebar();
  });
})();

function toggleAccordion(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

/* Sub-Page Navigation */
function openSubpage(viewName, extraId = null) {
  currentView = viewName;
  if (viewName === 'goalPlan' && extraId) activeGoalId = extraId;
  if (viewName === 'diveSpaceDetail' && extraId) {
    activeDiveSpaceId = extraId;
    diveTbcPage = 1;
    diveDonePage = 1;
  }
  if (viewName === 'timeline') {
    selectedTimelineDate = null;
  }

  document.getElementById('matrixView').style.display = (viewName === 'matrix') ? 'block' : 'none';
  document.getElementById('declutterView').classList.toggle('active', viewName === 'declutter');
  document.getElementById('timelineView').classList.toggle('active', viewName === 'timeline');
  document.getElementById('goalPlanView').classList.toggle('active', viewName === 'goalPlan');
  document.getElementById('diveIntoView').classList.toggle('active', viewName === 'diveInto');
  document.getElementById('diveSpaceDetailView').classList.toggle('active', viewName === 'diveSpaceDetail');

  if (viewName === 'matrix') renderTableOnly();
  else updateFloatingPaginationVisibility();

  if (viewName === 'declutter') renderDeclutterList();
  if (viewName === 'timeline') renderTimelineSection();
  if (viewName === 'goalPlan') renderGoalActionPlan();
  if (viewName === 'diveInto') renderDiveSpacesGrid();
  if (viewName === 'diveSpaceDetail') renderDiveSpaceDetail();

  if (window.innerWidth <= 768) closeSidebar();
  window.scrollTo(0, 0);
}

function updateFloatingPaginationVisibility() {
  const totalPages = Math.max(1, pageSlices.length);
  const pagBar = document.getElementById('matrixPagination');

  if (currentView === 'matrix' && totalPages > 1) {
    pagBar.style.display = 'inline-flex';
    document.getElementById('pageIndicator').innerText = `${matrixPage} / ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = (matrixPage <= 1);
    document.getElementById('nextPageBtn').disabled = (matrixPage >= totalPages);
  } else {
    pagBar.style.display = 'none';
  }
}

function renderInlinePager(containerId, currentPage, totalItems, pageSize, onPageChangeFnName) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
  if (totalPages <= 1) {
    el.innerHTML = '';
    return;
  }
  const safePage = Math.min(totalPages, Math.max(1, currentPage));
  el.innerHTML = `
    <button type="button" onclick="${onPageChangeFnName}(${safePage - 1})" ${safePage <= 1 ? 'disabled' : ''}>‹</button>
    <span>${safePage} / ${totalPages}</span>
    <button type="button" onclick="${onPageChangeFnName}(${safePage + 1})" ${safePage >= totalPages ? 'disabled' : ''}>›</button>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function stripHtmlToText(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || div.innerText || '').trim();
}

/* Declutter Your Mind */
function addDeclutterBullet() {
  const inp = document.getElementById('declutterInput');
  const plain = inp.innerText.trim();
  const html = inp.innerHTML.trim();
  if (!plain) return;
  pushUndo();
  state.braindump.unshift({ text: html, struck: false });
  dymPage = 1;
  inp.innerHTML = '';
  save();
  renderDeclutterList();
}

function toggleDeclutterBullet(idx) {
  if (!state.braindump[idx]) return;
  pushUndo();
  state.braindump[idx].struck = !state.braindump[idx].struck;
  save();
  renderDeclutterList();
}

function editDeclutterBullet(idx, newHtml) {
  if (!state.braindump[idx] || state.braindump[idx].text === newHtml) return;
  pushUndo();
  state.braindump[idx].text = newHtml;
  save();
}

function deleteDeclutterBullet(idx) {
  pushUndo();
  state.braindump.splice(idx, 1);
  save();
  renderDeclutterList();
}

function setDymPage(p) {
  dymPage = p;
  renderDeclutterList();
}

function renderDeclutterList() {
  const ul = document.getElementById('declutterList');
  if (!state.braindump.length) {
    ul.innerHTML = '';
    renderInlinePager('dymPager', 1, 0, SUBPAGE_SIZE, 'setDymPage');
    return;
  }
  const totalPages = Math.max(1, Math.ceil(state.braindump.length / SUBPAGE_SIZE));
  if (dymPage > totalPages) dymPage = totalPages;
  const start = (dymPage - 1) * SUBPAGE_SIZE;
  const slice = state.braindump.slice(start, start + SUBPAGE_SIZE);

  ul.innerHTML = slice.map((item, offsetIdx) => {
    const idx = start + offsetIdx;
    return `
      <li class="declutter-bullet-item ${item.struck ? 'struck' : ''}">
        <div class="declutter-bullet-text" contenteditable="true" onblur="editDeclutterBullet(${idx}, this.innerHTML)">${item.text}</div>
        <button type="button" class="dym-line-btn" onclick="toggleDeclutterBullet(${idx})" title="${item.struck ? 'Restore' : 'Line through'}">${item.struck ? '↺' : '—'}</button>
        <button type="button" class="del-date" style="float:none;" onclick="deleteDeclutterBullet(${idx})" title="Delete">×</button>
      </li>
    `;
  }).join('');

  renderInlinePager('dymPager', dymPage, state.braindump.length, SUBPAGE_SIZE, 'setDymPage');
}

/* Your Upcoming Timeline + Expandable "Your Calendar" */
function addTimelineItem() {
  const d = document.getElementById('tlDateInput').value;
  const timeText = (document.getElementById('tlTimeTextInput').value || '').trim();
  const inp = document.getElementById('tlActivityInput');
  const plain = inp.innerText.trim();
  const html = inp.innerHTML.trim();
  if (!d || !plain) return;

  pushUndo();
  state.timeline.push({
    id: 'tl' + Date.now(),
    date: d,
    time: timeText,
    endTime: '',
    activity: html,
    status: 0
  });
  state.timeline.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
  const parts = d.split('-').map(Number);
  if (parts.length === 3) {
    tlCalYear = parts[0];
    tlCalMonth = parts[1] - 1;
  }
  inp.innerHTML = '';
  document.getElementById('tlTimeTextInput').value = '';
  save();
  renderTimelineSection();
}

function toggleTimelineStatus(id) {
  const item = state.timeline.find(x => x.id === id);
  if (!item) return;
  pushUndo();
  item.status = ((item.status || 0) + 1) % 3;
  save();
  renderTimelineSection();
}

function updateTimelineActivity(id, newHtml) {
  const item = state.timeline.find(x => x.id === id);
  if (!item || !newHtml.trim() || item.activity === newHtml) return;
  pushUndo();
  item.activity = newHtml;
  save();
  renderTimelineCalendar();
}

function deleteTimelineItem(id) {
  pushUndo();
  state.timeline = state.timeline.filter(x => x.id !== id);
  save();
  renderTimelineSection();
}

function toggleYourCalendar() {
  yourCalendarOpen = !yourCalendarOpen;
  if (!yourCalendarOpen) selectedTimelineDate = null;
  syncCalendarDrawerUI();
  if (yourCalendarOpen) renderTimelineCalendar();
}

function syncCalendarDrawerUI() {
  const chip = document.getElementById('yourCalendarChip');
  const drawer = document.getElementById('timelineCalDrawer');
  if (chip) chip.classList.toggle('open', yourCalendarOpen);
  if (drawer) drawer.classList.toggle('open', yourCalendarOpen);
}

function shiftTimelineCal(delta) {
  tlCalMonth += delta;
  if (tlCalMonth < 0) { tlCalMonth = 11; tlCalYear--; }
  if (tlCalMonth > 11) { tlCalMonth = 0; tlCalYear++; }
  selectedTimelineDate = null;
  renderTimelineCalendar();
}

function selectTimelineCalendarDate(isoDate) {
  selectedTimelineDate = (selectedTimelineDate === isoDate) ? null : isoDate;
  renderTimelineCalendar();
}

function getDateColor(isoDate) {
  let hash = 0;
  for (let i = 0; i < isoDate.length; i++) {
    hash = ((hash << 5) - hash) + isoDate.charCodeAt(i);
    hash |= 0;
  }
  return TIMELINE_EVENT_COLORS[Math.abs(hash) % TIMELINE_EVENT_COLORS.length];
}

function renderTimelineCalendar() {
  syncCalendarDrawerUI();
  if (!yourCalendarOpen) return;

  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const labelEl = document.getElementById('tlCalMonthLabel');
  const gridEl = document.getElementById('tlCalendarGrid');
  const detailBox = document.getElementById('tlSelectedEventsBox');
  if (!labelEl || !gridEl || !detailBox) return;

  labelEl.textContent = `${monthNames[tlCalMonth]} ${tlCalYear}`;

  const eventsByDate = {};
  state.timeline.forEach(ev => {
    if (!eventsByDate[ev.date]) eventsByDate[ev.date] = [];
    eventsByDate[ev.date].push(ev);
  });

  const dows = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let html = dows.map(d => `<div class="tl-cal-dow">${d}</div>`).join('');

  const firstDay = new Date(tlCalYear, tlCalMonth, 1).getDay();
  const offset = (firstDay + 6) % 7;
  for (let i = 0; i < offset; i++) {
    html += `<div class="tl-cal-day empty"></div>`;
  }

  const daysInMonth = new Date(tlCalYear, tlCalMonth + 1, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${tlCalYear}-${String(tlCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dStr] || [];
    const hasEv = dayEvents.length > 0;
    const isSel = selectedTimelineDate === dStr;
    const bgColor = hasEv ? getDateColor(dStr) : '';

    html += `
      <button
        type="button"
        class="tl-cal-day ${hasEv ? 'has-event' : ''} ${isSel ? 'selected-day' : ''}"
        style="${hasEv ? `background:${bgColor};` : ''}"
        onclick="selectTimelineCalendarDate('${dStr}')"
      >${day}</button>
    `;
  }
  gridEl.innerHTML = html;

  const selEvents = selectedTimelineDate ? (eventsByDate[selectedTimelineDate] || []) : [];
  if (!selectedTimelineDate || !selEvents.length) {
    detailBox.style.display = 'none';
    detailBox.innerHTML = '';
    return;
  }

  const badgeColor = getDateColor(selectedTimelineDate);
  detailBox.style.display = 'flex';
  detailBox.innerHTML = selEvents.map(ev => {
    const name = escapeHtml(stripHtmlToText(ev.activity) || 'Event');
    const timeStr = formatEventTimeDisplay(ev);
    const timePart = timeStr ? `<span class="tl-time-badge">${escapeHtml(timeStr)}</span>` : '';
    return `<span class="tl-event-only-pill" style="background:${badgeColor};">${name}${timePart}</span>`;
  }).join('');
}

function setTimelinePage(p) {
  timelinePage = p;
  renderTimelineTable();
}

function renderTimelineTable() {
  const tbody = document.getElementById('timelineBody');
  state.timeline.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));

  if (!state.timeline.length) {
    tbody.innerHTML = '';
    renderInlinePager('timelinePager', 1, 0, SUBPAGE_SIZE, 'setTimelinePage');
    return;
  }

  const totalPages = Math.max(1, Math.ceil(state.timeline.length / SUBPAGE_SIZE));
  if (timelinePage > totalPages) timelinePage = totalPages;
  const start = (timelinePage - 1) * SUBPAGE_SIZE;
  const slice = state.timeline.slice(start, start + SUBPAGE_SIZE);

  tbody.innerHTML = slice.map(item => {
    const sym = item.status === 1 ? '✓' : item.status === 2 ? '✗' : '';
    const cls = item.status === 1 ? 'status-done' : item.status === 2 ? 'status-cross' : '';
    const txtCls = item.status === 1 ? 'tl-done' : item.status === 2 ? 'tl-crossed' : '';
    const wk = getWeekdayShort(item.date);
    const timeStr = formatEventTimeDisplay(item);

    return `
      <tr>
        <td style="text-align:center;">
          <span class="status-btn ${cls}" onclick="toggleTimelineStatus('${item.id}')">${sym}</span>
        </td>
        <td style="font-weight:700; white-space:nowrap;">${formatDateDMY(item.date)} <span style="color:var(--muted); font-size:12px;">(${wk})</span></td>
        <td style="font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; user-select:none;">${timeStr ? escapeHtml(timeStr) : '—'}</td>
        <td class="${txtCls}" contenteditable="true" onblur="updateTimelineActivity('${item.id}', this.innerHTML)" style="outline:none;">${item.activity}</td>
        <td style="text-align:center;">
          <button type="button" class="del-date" style="float:none;" onclick="deleteTimelineItem('${item.id}')" title="Remove">×</button>
        </td>

function renderGoalActionPlan() {

        <div class="goal-task-footer">

/* Orange (status === 2) is strictly ignored: neither increases nor decreases completion % */
function renderGoalsOverview() {
  const wrap = document.getElementById('goalsOverviewBars');
  if (!state.goals.length) {
    wrap.innerHTML = '';
    return;
  }

  wrap.innerHTML = state.goals.map(g => {
    const evaluatedTasks = g.tasks.filter(t => t.status === 1 || t.status === 0);
    const tickedCount = evaluatedTasks.filter(t => t.status === 1).length;
    const pct = (evaluatedTasks.length === 0 || tickedCount === 0)
      ? 0
      : Math.round((tickedCount / evaluatedTasks.length) * 100);

    return `
      <div class="bar-row" style="margin-bottom:8px;">
        <span class="bar-label" title="${escapeHtml(g.name)}">${escapeHtml(g.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <strong style="white-space:nowrap;">${pct}% completed</strong>
      </div>
    `;
  }).join('');
}

/* Dive Into Blocks & To Be Completed / Already Done */
function getThemedBlockBg(sp, index) {
  const theme = state.theme || 'white';
  if (theme === 'dark') {
    return DIVE_DARK_PALETTE[index % DIVE_DARK_PALETTE.length];
  }
  if (theme === 'yellow') {
    const warmShades = ['#fde68a', '#fef08a', '#fed7aa', '#fbcfe8', '#d9f99d', '#fde047'];
    return warmShades[index % warmShades.length];
  }
  return sp.color || DIVE_PALETTE[index % DIVE_PALETTE.length];
}

function addDiveSpace() {
  const inp = document.getElementById('diveSpaceNameInput');
  const name = (inp.value || '').trim();
  if (!name) return;
  pushUndo();
  const color = DIVE_PALETTE[state.diveSpaces.length % DIVE_PALETTE.length];
  state.diveSpaces.push({
    id: 'ds' + Date.now(),
    name,
    color,
    tbc: [],
    completed: []
  });
  diveSpacesPage = Math.max(1, Math.ceil(state.diveSpaces.length / DIVE_BLOCK_PAGE_SIZE));
  inp.value = '';
  save();
  renderDiveSpacesGrid();
}

function deleteDiveSpace(spaceId, ev) {
  if (ev) ev.stopPropagation();
  pushUndo();
  state.diveSpaces = state.diveSpaces.filter(s => s.id !== spaceId);
  if (activeDiveSpaceId === spaceId) activeDiveSpaceId = null;
  save();
  if (currentView === 'diveSpaceDetail') openSubpage('diveInto');
  else renderDiveSpacesGrid();
}

function setDiveSpacesPage(p) {
  diveSpacesPage = p;
  renderDiveSpacesGrid();
}

function renderDiveSpacesGrid() {
  const grid = document.getElementById('diveSpacesGrid');
  if (!grid) return;

  if (!state.diveSpaces.length) {
    grid.innerHTML = '';
    renderInlinePager('diveSpacesPager', 1, 0, DIVE_BLOCK_PAGE_SIZE, 'setDiveSpacesPage');
    return;
  }

  const totalPages = Math.max(1, Math.ceil(state.diveSpaces.length / DIVE_BLOCK_PAGE_SIZE));
  if (diveSpacesPage > totalPages) diveSpacesPage = totalPages;
  const start = (diveSpacesPage - 1) * DIVE_BLOCK_PAGE_SIZE;
  const slice = state.diveSpaces.slice(start, start + DIVE_BLOCK_PAGE_SIZE);

  grid.innerHTML = slice.map((sp, offsetIdx) => {
    const globalIdx = start + offsetIdx;
    const bg = getThemedBlockBg(sp, globalIdx);
    return `
      <div class="dive-folder-card" style="background:${bg};" onclick="openSubpage('diveSpaceDetail', '${sp.id}')">
        <button type="button" class="dive-del-corner" onclick="deleteDiveSpace('${sp.id}', event)" title="Delete">×</button>
        <div class="dive-folder-name">${escapeHtml(sp.name)}</div>
      </div>

  }).join('');

  renderInlinePager('diveSpacesPager', diveSpacesPage, state.diveSpaces.length, DIVE_BLOCK_PAGE_SIZE, 'setDiveSpacesPage');
}

/* 4-State Status Box for Matrix:
   0 = Unchecked
   1 = Green ✓ (Completed)
   2 = Red ✗ (Incomplete)
   3 = Orange — (Not Relevant / Ignored in productivity averages)
*/
function cycleStatus(s) { return ((s || 0) + 1) % 4; }
function statusSymbol(s) { return s === 1 ? '✓' : s === 2 ? '✗' : s === 3 ? '—' : ''; }
function statusClass(s) { return s === 1 ? 'status-done' : s === 2 ? 'status-cross' : s === 3 ? 'status-orange' : ''; }

function getCell(date, colId) {
  const key = `${date}_${colId}`;
  if (!state.records[key]) state.records[key] = { status: 0, time: '', subs: [] };
  return state.records[key];
}

function formatText(cmd, val = null) { document.execCommand(cmd, false, val); }
function insertSticker(emoji) { document.execCommand('insertText', false, ' ' + emoji + ' '); }

function renderSidebarControls() {
  document.getElementById('titleInput').value = state.title;
  setLogDateControls(selectedLogDateISO || TODAY);

  const mgr = document.getElementById('colManager');
  mgr.innerHTML = state.columns.map(col => `
    <div class="col-manage-row">
      <input type="color" value="${col.color}" onchange="updateColColor('${col.id}', this.value)" style="width:26px;height:26px;border:none;background:none;cursor:pointer;">
      <input type="text" value="${escapeHtml(col.name)}" onchange="updateColName('${col.id}', this.value)" class="side-input" style="margin:0;">
      <button type="button" onclick="deleteColumn('${col.id}')" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;">×</button>
    </div>`).join('') + `
    <div class="col-manage-row">
      <input type="color" value="${state.notesColor}" onchange="updateNotesColor(this.value)" style="width:26px;height:26px;border:none;background:none;cursor:pointer;">
      <span style="font-size:12px;color:var(--muted);">Notes Column Color</span>
    </div>`;
}

function buildDateRowElement(date) {
  const tr = document.createElement('tr');
  const wk = getWeekdayShort(date);
  tr.innerHTML = `
    <td class="date-cell">
      <button type="button" class="del-date" onclick="removeDateRow('${date}')" title="Remove date">×</button>
      <div><span>${formatDateDMY(date)}</span><span class="weekday-sub">${wk}</span></div>
    </td>
  `;

  state.columns.forEach(col => {
    const cell = getCell(date, col.id);
    const td = document.createElement('td');
    td.className = 'themed-cell';
    td.style.background = col.color;

    const subsHtml = cell.subs.map((sub, idx) => {
      const tClass = sub.status === 1 ? 'done' : sub.status === 2 ? 'cross' : sub.status === 3 ? 'orange' : '';
      return `
      <li class="sub-item">
        <span class="status-btn ${statusClass(sub.status)}" onclick="toggleSub('${date}','${col.id}',${idx})" title="Cycle: Done (✓) → Missed (✗) → Not Relevant (—)">${statusSymbol(sub.status)}</span>
        <div class="sub-text ${tClass}" contenteditable="true" onblur="editSubText('${date}','${col.id}',${idx},this.innerHTML)">${sub.text}</div>
        <span class="time-tag" contenteditable="true" onblur="editSubTime('${date}','${col.id}',${idx},this.innerText)">${sub.time || 'time'}</span>
        <span onclick="delSub('${date}','${col.id}',${idx})" style="cursor:pointer;color:var(--muted);font-size:13px;">×</span>
      </li>`;
    }).join('');

    td.innerHTML = `
      <div class="cell-top">
        <span class="status-btn ${statusClass(cell.status)}" onclick="toggleMain('${date}','${col.id}')" title="Click: ✓ Done | ✗ Missed | — Not Relevant">${statusSymbol(cell.status)}</span>
        <span style="font-size:12px;font-weight:600;">All tasks</span>
        <span class="time-tag" contenteditable="true" onblur="editMainTime('${date}','${col.id}',this.innerText)">${cell.time || '+ time'}</span>
      </div>
      <ul class="sub-list">${subsHtml}</ul>
      <button type="button" class="add-sub" onclick="addSub('${date}','${col.id}')">+ Add task / chapter</button>`;
    tr.appendChild(td);
  });

  const notesTd = document.createElement('td');
  notesTd.className = 'themed-cell';
  notesTd.style.background = state.notesColor;
  notesTd.innerHTML = `<div class="notes-box" contenteditable="true" onblur="editNote('${date}', this.innerHTML)">${state.notes[date] || ''}</div>`;
  tr.appendChild(notesTd);

  return tr;
}

/* Dynamically fills the visible iPhone / Mac screen before breaking to the next page */
function renderTableOnly() {
  document.getElementById('pageTitle').innerText = state.title;
  document.title = state.title;

  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('matrixBody');
  headerRow.innerHTML = '<th class="date-cell">Date</th>';

  state.columns.forEach(col => {
    const th = document.createElement('th');
    th.style.background = col.color;
    th.innerText = col.name;
    headerRow.appendChild(th);
  });

  const notesTh = document.createElement('th');
  notesTh.style.background = state.notesColor;
  notesTh.innerText = 'Notes';
  headerRow.appendChild(notesTh);

  tbody.innerHTML = '';
  const allRows = state.dates.map(date => {
    const tr = buildDateRowElement(date);
    tbody.appendChild(tr);
    return tr;
  });

  const tbodyTop = tbody.getBoundingClientRect().top;
  const bottomReserve = 64;
  const maxBodyHeight = Math.max(240, window.innerHeight - tbodyTop - bottomReserve);

  const slices = [];
  let startIdx = 0;
  let currentHeight = 0;

  allRows.forEach((tr, idx) => {
    const rowH = tr.offsetHeight || 110;
    if (idx > startIdx && (currentHeight + rowH) > maxBodyHeight) {
      slices.push([startIdx, idx]);
      startIdx = idx;
      currentHeight = rowH;
    } else {
      currentHeight += rowH;
    }
  });
  if (state.dates.length > 0) {
    slices.push([startIdx, state.dates.length]);
  }

  pageSlices = slices.length ? slices : [[0, 0]];
  if (matrixPage > pageSlices.length) matrixPage = pageSlices.length;
  if (matrixPage < 1) matrixPage = 1;

  const [visStart, visEnd] = pageSlices[matrixPage - 1];
  allRows.forEach((tr, idx) => {
    if (idx < visStart || idx >= visEnd) {
      tr.remove();
    }
  });

  updateFloatingPaginationVisibility();
}

function render() {
  applyTheme();
  renderSidebarControls();
  renderGoalsSidebar();
  renderGoalsOverview();
  renderTableOnly();
  renderDashboard();
  renderDeclutterList();
  renderTimelineSection();
  renderDiveSpacesGrid();
  if (currentView === 'goalPlan') renderGoalActionPlan();
  if (currentView === 'diveSpaceDetail') renderDiveSpaceDetail();
}

function editNote(date, html) {
  if ((state.notes[date] || '') === html) return;
  pushUndo();
  state.notes[date] = html;
  save();
}
function toggleMain(d, c) {
  pushUndo();
  const cell = getCell(d, c);
  cell.status = cycleStatus(cell.status);
  save();
  renderTableOnly();
}
function editMainTime(d, c, val) {
  const clean = val === '+ time' ? '' : val.trim();
  if (getCell(d, c).time === clean) return;
  pushUndo();
  getCell(d, c).time = clean;
  save();
}
function addSub(d, c) {
  pushUndo();
  getCell(d, c).subs.push({ text: 'New task', time: '', status: 0 });
  save();
  renderTableOnly();
}
function toggleSub(d, c, i) {
  pushUndo();
  const s = getCell(d, c).subs[i];
  s.status = cycleStatus(s.status);
  save();
  renderTableOnly();
}
function editSubText(d, c, i, html) {
  if (getCell(d, c).subs[i].text === html) return;
  pushUndo();
  getCell(d, c).subs[i].text = html;
  save();
  renderTableOnly();
}
function editSubTime(d, c, i, val) {
  const clean = val === 'time' ? '' : val.trim();
  if (getCell(d, c).subs[i].time === clean) return;
  pushUndo();
  getCell(d, c).subs[i].time = clean;
  save();
}
function delSub(d, c, i) {
  pushUndo();
  getCell(d, c).subs.splice(i, 1);
  save();
  renderTableOnly();
}

/* Productivity Calculation (Completely disregards status === 3 Orange tasks) */
function calcDayScore(date) {
  let total = 0, done = 0;
  state.columns.forEach(col => {
    const cell = state.records[`${date}_${col.id}`];
    if (!cell) return;
    if (cell.subs && cell.subs.length > 0) {
      cell.subs.forEach(s => {
        if (s.status === 3) return;
        total++;
        if (s.status === 1) done++;
      });
    } else if (cell.status > 0 && cell.status !== 3) {
      total++;
      if (cell.status === 1) done++;
    }
  });
  return total === 0 ? null : Math.round((done / total) * 100);
}

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderDashboard();
}

function renderDashboard() {
  const todayScore = calcDayScore(TODAY);
  const todayDisplay = todayScore !== null ? todayScore : 0;
  document.getElementById('todayChart').innerHTML = `
    <div class="bar-row">
      <span class="bar-label">${formatDateDMY(TODAY)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${todayDisplay}%"></div></div>
      <strong>${todayScore !== null ? todayScore + '%' : '0%'}</strong>
    </div>`;

  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const buckets = Array.from({ length: 7 }, () => []);
  state.dates.forEach(d => {
    const score = calcDayScore(d);
    if (score !== null) {
      buckets[new Date(d).getDay()].push(score);
    }
  });
  document.getElementById('weekChart').innerHTML = [1,2,3,4,5,6,0].map(dayIdx => {
    const arr = buckets[dayIdx];
    const avg = arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
    return `<div class="bar-row"><span class="bar-label">${days[dayIdx]}</span><div class="bar-track"><div class="bar-fill" style="width:${avg}%"></div></div><span>${avg}%</span></div>`;
  }).join('');

  // 4-Tier Monthly Overview
  const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  document.getElementById('monthLabel').innerText = `${monthNames[viewMonth]} ${viewYear}`;

  const dows = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let mHtml = dows.map(w => `<div class="m-dow">${w}</div>`).join('');

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const offset = (firstDay + 6) % 7;
  for (let i = 0; i < offset; i++) mHtml += `<div class="m-day empty"></div>`;

  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const sc = calcDayScore(dStr);
    let cls = '';
    if (sc !== null) {
      if (sc === 0) cls = 'lvl-red';
      else if (sc < 50) cls = 'lvl-orange';
      else if (sc < 100) cls = 'lvl-green-light';
      else cls = 'lvl-green-dark';
    }
    mHtml += `<div class="m-day ${cls}" title="${formatDateDMY(dStr)}${sc !== null ? ': ' + sc + '%' : ''}">${day}</div>`;
  }
  document.getElementById('monthChart').innerHTML = mHtml;
}

window.addEventListener('resize', () => {
  if (currentView === 'matrix') renderTableOnly();
});

window.reloadState = function () {
  state = normalizeState(JSON.parse(localStorage.getItem('iqraMatrixCleanV1')));
  render();
};
window.render = render;
render();

<script>
  const DB_URL = "https://iqra-s-day-tracker-default-rtdb.europe-west1.firebasedatabase.app/iqra_private_matrix_9921/matrixData.json";
  let lastSyncedValue = localStorage.getItem("iqraMatrixCleanV1") || "";

  window.pushToCloud = function () {
    const val = localStorage.getItem("iqraMatrixCleanV1");
    if (!val) return;
    lastSyncedValue = val;
    fetch(DB_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(val)
    }).catch(err => console.error("Cloud save failed:", err));
  };

  async function pullFromCloud() {
    try {
      const res = await fetch(DB_URL + "?t=" + Date.now());
      const cloudVal = await res.json();
      if (!cloudVal || typeof cloudVal !== "string") return;

      if (cloudVal !== lastSyncedValue && localStorage.getItem("iqraMatrixCleanV1") !== cloudVal) {
        lastSyncedValue = cloudVal;
        localStorage.setItem("iqraMatrixCleanV1", cloudVal);
        if (window.reloadState) window.reloadState();
      }
    } catch (err) {
      console.error("Cloud fetch failed:", err);
    }
  }

  pullFromCloud();
  setInterval(pullFromCloud, 2000);
</script>
